<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Inter"; src: url("fonts/Inter.ttf"); font-weight: 100 900; }
@font-face { font-family: "Naskh"; src: url("fonts/NotoNaskhArabic.ttf"); font-weight: 400 700; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; background: transparent; overflow: hidden; font-family: "Inter", sans-serif; color: #0b0b0f; }
.abs { position: absolute; }
.ar { font-family: "Naskh", serif; direction: rtl; unicode-bidi: isolate; }
.emo { font-family: "Noto Color Emoji"; line-height: 1; }
.glass { background: linear-gradient(160deg, rgba(255,255,255,.94), rgba(246,246,250,.80)); box-shadow: 0 24px 60px rgba(20,20,40,.16), inset 0 0 0 1.5px rgba(255,255,255,.95); }

/* полоса алфавита */
#strip { left: 160px; width: 760px; top: 92px; height: 124px; border-radius: 62px; overflow: hidden;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 22%, #000 78%, transparent 100%); }
#strip span { position: absolute; top: 0; left: 0; width: 90px; height: 124px; line-height: 124px; margin-left: -45px; text-align: center;
  font-family: "Naskh"; font-weight: 700; font-size: 52px; color: #0b0b0f; }
#count { right: 160px; top: 230px; font-size: 22px; font-weight: 600; letter-spacing: .14em; color: rgba(11,11,15,.55); }
#label { left: 160px; top: 230px; font-size: 22px; font-weight: 500; letter-spacing: .14em; color: rgba(11,11,15,.55); }

/* ученик */
.who { left: 50%; top: 286px; height: 112px; border-radius: 999px; display: flex; align-items: center; gap: 20px; padding: 0 48px 0 16px; transform-origin: center; }
.who .av { width: 80px; height: 80px; border-radius: 50%; background: #0b0b0f; color: #fff; font-weight: 800; font-size: 34px; display: flex; align-items: center; justify-content: center; }
.who small { display: block; font-size: 21px; letter-spacing: .14em; color: rgba(11,11,15,.5); font-weight: 600; text-transform: uppercase; }
.who b { font-size: 44px; letter-spacing: -.02em; }

/* карточка буквы */
.card { left: 0; top: 0; width: 1080px; height: 1920px; }
.big { left: 0; width: 1080px; top: 960px; text-align: center; font-family: "Naskh"; font-weight: 700; font-size: 280px; line-height: 1.3; }
.bname { left: 0; width: 1080px; top: 1380px; text-align: center; font-size: 34px; letter-spacing: .18em; color: rgba(11,11,15,.5); font-weight: 500; }
.bname .ar { font-size: 46px; letter-spacing: 0; color: rgba(11,11,15,.75); font-weight: 700; }
.badge { left: 540px; top: 1022px; width: 128px; height: 128px; margin-left: -232px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: "Naskh"; font-weight: 700; font-size: 70px; line-height: 1; padding-bottom: 10px; }
.icon { left: 540px; top: 1000px; width: 172px; height: 172px; margin-left: -86px; border-radius: 50px; display: flex; align-items: center; justify-content: center; }
.icon .ico { width: 96px; height: 96px; color: #0b0b0f; overflow: visible; }
.ico.h g, .ico.h path, .ico.h circle { stroke-width: 1.3px; }
.ico.p * { stroke-width: 3.2px; }
.glow { left: 540px; top: 1090px; width: 420px; height: 260px; margin: -130px 0 0 -210px; border-radius: 50%; filter: blur(50px); opacity: .55;
  background: radial-gradient(circle at 30% 40%, #8fa4ff 0, transparent 60%), radial-gradient(circle at 70% 50%, #ff9ccf 0, transparent 60%), radial-gradient(circle at 50% 80%, #ffd27a 0, transparent 60%); }
.word { left: 0; width: 1080px; top: 1166px; text-align: center; font-family: "Naskh"; font-weight: 700; font-size: 124px; line-height: 1.45; direction: rtl; }
.trans { left: 0; width: 1080px; top: 1366px; text-align: center; font-size: 66px; font-weight: 700; letter-spacing: -.04em; }

/* субтитры преподавателя */
.sub { left: 90px; width: 900px; top: 1460px; border-radius: 44px; padding: 34px 40px 38px; text-align: center; }
.sub .l { font-size: 58px; font-weight: 700; letter-spacing: -.035em; line-height: 1.08; }
.sub .w { display: inline-block; }

/* финал */
#end { left: 0; top: 0; width: 1080px; height: 1920px; background: rgba(245,245,248,.86); }
#end .eyebrow { position: absolute; left: 0; width: 1080px; top: 420px; text-align: center; font-size: 26px; letter-spacing: .2em; font-weight: 600; color: rgba(11,11,15,.5); text-transform: uppercase; }
#end h1 { position: absolute; left: 0; width: 1080px; top: 470px; text-align: center; font-size: 110px; letter-spacing: -.05em; line-height: 1; font-weight: 800; }
#end h1 span { display: block; color: #8d8d95; }
#grid { position: absolute; left: 110px; width: 860px; top: 760px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 22px; direction: rtl; }
#grid div { height: 108px; border-radius: 30px; display: flex; align-items: center; justify-content: center; font-family: "Naskh"; font-weight: 700; font-size: 54px; line-height: 1; padding-bottom: 8px; }
#end .stat { position: absolute; left: 0; width: 1080px; top: 1380px; text-align: center; font-size: 34px; font-weight: 500; letter-spacing: .06em; color: rgba(11,11,15,.6); }
#end .ok { position: absolute; left: 490px; top: 1460px; width: 100px; height: 100px; border-radius: 50%; background: #0b0b0f; color: #fff; font-size: 58px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (p) => 1 - Math.pow(1 - p, 4);
const back = (p) => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
let D, R = {};
const ORDER = "ابتثجحخدذرزسشصضطظعغفقكلمنوهي".split("");   // порядок, как его называют ученики

function set(el, op, y = 0, sc = 1, blur = 0, x = 0) {
  el.style.opacity = op.toFixed(3);
  el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${sc.toFixed(4)})`;
  el.style.filter = blur > 0.25 ? `blur(${blur.toFixed(1)}px)` : "none";
  el.style.display = op > 0.003 ? "" : "none";
}
// появление (in) и уход (out) с размытием; возвращает [прозрачность, сдвиг, размытие]
function io(t, t0, t1, din = 0.5, dout = 0.28, rise = 26, blurIn = 16) {
  const p = ease(clamp((t - t0) / din)), q = ease(clamp((t - (t1 - dout)) / dout));
  return [clamp((t - t0) / din * 1.6) * (1 - q), (1 - p) * rise - q * 18, (1 - p) * blurIn + q * 12];
}

let ICONS = {};
const ICON = (L) => { const ic = ICONS[L]; if (!ic) return ""; const set = ic.src.startsWith("Hugeicons") ? "h" : "p";
  return `<svg class="ico ${set}" viewBox="${ic.viewBox}" fill="none">${ic.body}</svg>`; };
function build(data) {
  D = data; ICONS = data.icons || {};
  D.cards.forEach((c) => { c.fill = ICONS[c.letter]?.fill; });
  const root = document.getElementById("root");
  root.innerHTML = `
    <div id="strip" class="abs glass">${ORDER.map((l) => `<span>${l}</span>`).join("")}</div>
    <div id="label" class="abs">АРАБСКИЙ АЛФАВИТ</div><div id="count" class="abs"></div>
    ${D.names.map((n, i) => `<div class="abs who glass" id="who${i}"><div class="av">${n.name[0]}</div><div><small>ученик</small><b>${n.name}</b></div></div>`).join("")}
    ${D.subs.map((s, i) => `<div class="abs sub glass" id="sub${i}">${s.lines.map((l) => `<div class="l">${l.split(" ").map((w) => `<span class="w">${w}</span>`).join(" ")}</div>`).join("")}</div>`).join("")}
    ${D.cards.map((c, i) => `<div class="abs card" id="card${i}">
        <div class="abs big">${c.letter}</div>
        <div class="abs bname"><span class="ar">${c.name}</span> · ${c.name_ru}</div>
        ${c.word ? `<div class="abs badge glass">${c.letter}</div>
        <div class="abs icon glass">${ICON(c.letter)}</div>
        <div class="abs word ar">${c.word}</div>
        <div class="abs trans">${c.tr}</div>` : ""}
      </div>`).join("")}
    <div id="end" class="abs"><div class="eyebrow">[ проверка пройдена ]</div><h1>28 букв.<span>4 ученика.</span></h1>
      <div id="grid">${ORDER.map((l) => `<div class="glass">${l}</div>`).join("")}</div>
      <div class="stat">27 слов · с огласовками и переводом</div><div class="ok">✓</div></div>`;
  R.strip = document.getElementById("strip");
  R.glyphs = [...R.strip.querySelectorAll("span")];
  R.count = document.getElementById("count");
  R.label = document.getElementById("label");
  R.end = document.getElementById("end");
  R.cells = [...document.querySelectorAll("#grid div")];
  R.cards = D.cards.map((c, i) => {
    const el = document.getElementById("card" + i), q = (s) => el.querySelector(s);
    const strokes = [...el.querySelectorAll(".ico path, .ico circle, .ico rect, .ico line, .ico polyline, .ico ellipse, .ico polygon")]
      .map((sh) => { let L = 100; try { L = sh.getTotalLength() + 1; } catch (e) {} sh.style.strokeDasharray = L; sh.style.strokeDashoffset = L; return [sh, L]; });
    return { el, c, big: q(".big"), bname: q(".bname"), badge: q(".badge"), icon: q(".icon"), ico: q(".ico"), strokes,
             word: q(".word"), trans: q(".trans") };
  });
  R.who = D.names.map((n, i) => document.getElementById("who" + i));
  R.subs = D.subs.map((s, i) => ({ el: document.getElementById("sub" + i), ws: [...document.querySelectorAll(`#sub${i} .w`)], s }));
}

function render(t) {
  // полоса алфавита и счётчик (после вступления)
  const sOn = io(t, 5.9, D.end + 0.3, 0.6, 0.4);
  [R.strip, R.count, R.label].forEach((e) => set(e, sOn[0], sOn[1] * 0.5, 1, sOn[2] * 0.6));
  let cur = -1;
  D.cards.forEach((c, i) => { if (t >= c.tl) cur = i; });
  // позиция карусели плавно доезжает до текущей буквы; следующие буквы — левее (письмо справа налево)
  const k = cur >= 0 ? ease(clamp((t - D.cards[cur].tl) / 0.4)) : 1;
  const pos = cur <= 0 ? Math.max(cur, 0) : (cur - 1) + k;
  R.glyphs.forEach((g, i) => {
    const d = i - pos, ad = Math.abs(d);
    const x = 380 - d * 96;
    const sc = 1.45 - Math.min(ad, 1) * 0.55 - Math.max(ad - 1, 0) * 0.04;
    const op = i < cur || (i === cur) ? Math.max(0.12, 1 - ad * 0.24) : Math.max(0.06, 0.42 - ad * 0.09);
    g.style.left = x.toFixed(1) + "px";
    g.style.transform = `scale(${sc.toFixed(3)})`;
    g.style.opacity = op.toFixed(3);
  });
  R.count.textContent = `${String(Math.max(cur + 1, 0)).padStart(2, "0")} / 28`;

  // ученики
  D.names.forEach((n, i) => {
    const [op, y, bl] = io(t, n.t, n.t + 2.2, 0.5, 0.35, 30);
    const sc = 0.85 + 0.15 * back(clamp((t - n.t) / 0.6));
    R.who[i].style.marginLeft = -R.who[i].offsetWidth / 2 + "px";
    set(R.who[i], op, y, t >= n.t ? sc : 0.85, bl);
  });

  // субтитры преподавателя: слово за словом
  R.subs.forEach(({ el, ws, s }) => {
    const [op, y, bl] = io(t, s.t, s.end, 0.4, 0.25, 20, 10);
    set(el, op, y, 1, bl);
    ws.forEach((w, k) => {
      const p = clamp((t - s.t - 0.06 * k) / 0.45), e = ease(p);
      set(w, clamp(p * 1.6), (1 - e) * 22, 1, (1 - e) * 14);
    });
  });

  // карточки букв
  R.cards.forEach(({ el, c, big, bname, badge, icon, ico, strokes, word, trans }) => {
    const on = t >= c.tl - 0.02 && t <= c.end + 0.02;
    el.style.display = on ? "" : "none";
    if (!on) return;
    const out = ease(clamp((t - (c.end - 0.26)) / 0.26));
    const fade = 1 - out, outBlur = out * 12, outY = -out * 20;
    const pin = ease(clamp((t - c.tl) / 0.45));
    // фаза слова: буква «перелетает» в бейдж
    const tw = c.tw ?? 1e9;
    const m = ease(clamp((t - tw) / 0.42));
    const bigOp = clamp((t - c.tl) / 0.28) * (1 - m) * fade;
    set(big, bigOp, (1 - pin) * 30 + outY - m * 60, (0.9 + 0.1 * pin) * (1 - 0.55 * m), (1 - pin) * 18 + m * 14 + outBlur, -m * 200);
    set(bname, clamp((t - c.tl - 0.12) / 0.3) * (1 - m) * fade, (1 - ease(clamp((t - c.tl - 0.12) / 0.4))) * 18 + outY, 1, (1 - pin) * 10 + m * 10 + outBlur);
    if (!c.word) return;
    const pb = ease(clamp((t - tw - 0.15) / 0.4));
    set(badge, clamp((t - tw - 0.15) / 0.25) * fade, (1 - pb) * 20 + outY, 0.6 + 0.4 * back(clamp((t - tw - 0.15) / 0.5)), (1 - pb) * 10 + outBlur);
    // иконка: стеклянная плитка выезжает, линия иконки прорисовывается (как в SF Symbols)
    const pi = clamp((t - tw) / 0.5);
    set(icon, clamp((t - tw) / 0.25) * fade, (1 - ease(pi)) * 24 + outY, 0.86 + 0.14 * ease(pi), (1 - ease(pi)) * 10 + outBlur);
    const pd = ease(clamp((t - tw - 0.08) / 0.75));
    strokes.forEach(([sh, L]) => { sh.style.strokeDashoffset = (L * (1 - pd)).toFixed(1); });
    if (c.fill) ico.style.fill = `rgba(11,11,15,${clamp((t - tw - 0.55) / 0.35).toFixed(3)})`;
    const pw = ease(clamp((t - tw) / 0.5));
    set(word, clamp((t - tw) / 0.3) * fade, (1 - pw) * 34 + outY, 0.96 + 0.04 * pw, (1 - pw) * 18 + outBlur);
    const pt = ease(clamp((t - tw - 0.2) / 0.45));
    set(trans, clamp((t - tw - 0.2) / 0.3) * fade, (1 - pt) * 26 + outY, 1, (1 - pt) * 14 + outBlur);
  });

  // финальная карточка
  const pe = clamp((t - D.end) / 0.5);
  set(R.end, pe, 0, 1, 0);
  if (pe > 0) R.cells.forEach((cell, k) => {
    const p = clamp((t - D.end - 0.35 - k * 0.035) / 0.4), e = ease(p);
    set(cell, clamp(p * 1.5), (1 - e) * 26, 0.8 + 0.2 * back(p), (1 - e) * 10);
  });
  return true;
}
window.build = build; window.render = render;
</script>
</body>
</html>
