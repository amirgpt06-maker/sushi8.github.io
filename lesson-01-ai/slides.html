<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Урок 1 · Что такое ИИ</title>
<style>
@font-face { font-family: "Inter"; src: url("Inter.ttf") format("truetype"); font-weight: 100 900; }
:root {
  --bg: #f2f2f5; --ink: #0b0b0f; --gray: #8d8d95; --sub: #4a4a52; --card: rgba(255,255,255,.78);
  --blue: #5468f0; --pink: #e3477e; --orange: #ee9a2a;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; background: var(--bg); overflow: hidden; font-family: "Inter", system-ui, sans-serif; color: var(--ink); }
#stage { width: 1920px; height: 1080px; position: absolute; left: 50%; top: 50%; transform-origin: 0 0; }
.slide { position: absolute; inset: 0; padding: 96px 120px; display: none; }
.slide.on { display: block; }

.eyebrow { font-size: 26px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--gray); }
h1 { font-size: 112px; line-height: .98; font-weight: 800; letter-spacing: -.045em; margin-top: 28px; }
h1 span { display: block; }
h1 span + span { color: var(--gray); }
.sub { font-size: 36px; line-height: 1.35; color: var(--sub); font-weight: 500; margin-top: 36px; max-width: 900px; }

.foot { position: absolute; left: 120px; right: 120px; bottom: 56px; display: flex; justify-content: space-between;
  font-size: 20px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--gray); }

.dot { width: 16px; height: 16px; border-radius: 50%; flex: none; }
.blue .dot, .dot.blue { background: var(--blue); } .pink .dot, .dot.pink { background: var(--pink); } .orange .dot, .dot.orange { background: var(--orange); }

.pill { position: absolute; display: flex; align-items: center; gap: 18px; padding: 26px 40px; border-radius: 999px;
  background: var(--card); backdrop-filter: blur(20px); font-size: 34px; font-weight: 700; white-space: nowrap;
  box-shadow: 0 20px 50px rgba(40,40,90,.14), inset 0 0 0 1.5px rgba(255,255,255,.9); }

/* Стеклянный «иконка-квадрат» как на постере */
.orb { position: absolute; width: 460px; height: 460px; }
.glow { position: absolute; inset: -140px; border-radius: 50%; filter: blur(70px); opacity: .85;
  background: radial-gradient(circle at 30% 30%, #6f86ff 0, transparent 50%), radial-gradient(circle at 75% 45%, #ff6fae 0, transparent 50%), radial-gradient(circle at 45% 80%, #ffbe4a 0, transparent 50%); }
.squircle { position: absolute; inset: 0; border-radius: 120px; overflow: hidden;
  background: radial-gradient(circle at 25% 25%, #7f98ff 0, transparent 55%), radial-gradient(circle at 80% 35%, #ff86c8 0, transparent 55%),
  radial-gradient(circle at 40% 85%, #ffc95e 0, transparent 55%), #f7d7ec;
  box-shadow: inset 0 0 0 3px rgba(255,255,255,.75), 0 40px 90px rgba(120,80,160,.25); }
.squircle::after { content: ""; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255,255,255,.35), transparent 45%); }
.star { position: absolute; left: 50%; top: 50%; width: 46%; transform: translate(-50%,-50%); filter: drop-shadow(0 8px 20px rgba(0,0,0,.08)); }

/* hero */
.hero .text { position: relative; z-index: 2; width: 1000px; margin-top: 60px; }
.hero .orb { right: 360px; top: 320px; }
.hero .p0 { right: 560px; top: 240px; } .hero .p1 { right: 60px; top: 560px; } .hero .p2 { right: 720px; top: 780px; }

/* chips */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; margin-top: 64px; }
.chip { background: var(--card); border-radius: 36px; padding: 38px 40px; box-shadow: 0 18px 44px rgba(40,40,90,.08), inset 0 0 0 1.5px #fff; }
.chip .head { display: flex; align-items: center; gap: 16px; font-size: 36px; font-weight: 800; letter-spacing: -.02em; }
.chip p { font-size: 26px; color: var(--sub); margin-top: 14px; line-height: 1.35; font-weight: 500; }

/* steps */
.row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; margin-top: 70px; }
.step { position: relative; border-radius: 44px; padding: 44px; min-height: 420px; overflow: hidden; background: #fff;
  box-shadow: 0 24px 60px rgba(40,40,90,.10), inset 0 0 0 1.5px #fff; }
.step::before { content: ""; position: absolute; width: 360px; height: 360px; right: -120px; top: -140px; border-radius: 50%; filter: blur(50px); opacity: .55; }
.step.blue::before { background: #7f98ff; } .step.pink::before { background: #ff86c8; } .step.orange::before { background: #ffc95e; }
.step .tag { position: relative; display: inline-flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--sub);
  background: rgba(255,255,255,.8); padding: 12px 22px; border-radius: 999px; }
.step h3 { position: relative; font-size: 54px; font-weight: 800; letter-spacing: -.035em; margin-top: 110px; }
.step p { position: relative; font-size: 28px; color: var(--sub); margin-top: 16px; line-height: 1.35; font-weight: 500; }

/* define */
.define .quote { font-size: 54px; line-height: 1.2; font-weight: 700; letter-spacing: -.025em; margin-top: 60px; max-width: 1500px; color: var(--sub); }
.define .quote b { color: var(--ink); background: linear-gradient(90deg, rgba(127,152,255,.35), rgba(255,134,200,.35)); border-radius: 12px; padding: 0 8px; }
.define .vs { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-top: 64px; }
.define .vs .chip:last-child { background: linear-gradient(135deg, #e6eaff, #ffe3f1 60%, #fff1d6); }

/* prompt */
.prompt .cols { display: grid; grid-template-columns: 1fr 1.5fr; gap: 32px; margin-top: 60px; }
.bubble { border-radius: 40px; padding: 40px 44px; font-size: 34px; line-height: 1.35; font-weight: 600; }
.bubble small { display: block; font-size: 22px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; margin-bottom: 18px; }
.bad { background: #fff; color: var(--gray); box-shadow: 0 18px 44px rgba(40,40,90,.08); }
.bad small { color: #c0392b; }
.good { background: linear-gradient(135deg, #e6eaff, #ffe3f1 60%, #fff1d6); box-shadow: 0 24px 60px rgba(120,80,160,.16), inset 0 0 0 2px #fff; }
.good small { color: #1f9d55; }
.recipe { display: flex; gap: 20px; margin-top: 44px; }
.recipe .pill { position: static; font-size: 30px; padding: 20px 34px; }

/* final */
.final .tasks { margin-top: 56px; display: grid; gap: 22px; width: 1000px; }
.final .tasks .chip { display: flex; align-items: center; gap: 24px; font-size: 36px; font-weight: 700; padding: 30px 40px; }
.final .n { font-size: 26px; color: var(--gray); font-weight: 800; width: 40px; }
.final .orb { right: 200px; top: 300px; width: 400px; height: 400px; }
.final .cta { position: absolute; left: 120px; right: 120px; bottom: 120px; display: flex; justify-content: space-between; align-items: flex-end; }
.final .cta .lbl { font-size: 24px; font-weight: 700; letter-spacing: .18em; color: var(--gray); }
.final .cta .nick { font-size: 52px; font-weight: 800; letter-spacing: -.02em; margin-top: 8px; }
.final .btn { background: var(--ink); color: #fff; border-radius: 999px; padding: 36px 70px; font-size: 40px; font-weight: 700; }
.final .foot { display: none; }

/* Анимации: появление (in) и бесконечное «дыхание» с периодом 6с (для бесшовной петли в видео) */
.in { animation: in .9s cubic-bezier(.2,.8,.2,1) both; }
@keyframes in { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
.pop { animation: pop 1.1s cubic-bezier(.2,.9,.25,1.15) both; }
@keyframes pop { from { opacity: 0; transform: scale(.7) rotate(-14deg); } to { opacity: 1; transform: none; } }
.float { animation: float 6s ease-in-out infinite; }
@keyframes float { 0%,100% { transform: translateY(0) rotate(-5deg); } 50% { transform: translateY(-18px) rotate(-2deg); } }
.bob { animation: bob 6s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
.pulse { animation: pulse 6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.08); opacity: .95; } }
.spin { animation: spin 6s linear infinite; transform-origin: 50% 50%; }
@keyframes spin { from { transform: translate(-50%,-50%) rotate(0); } to { transform: translate(-50%,-50%) rotate(90deg); } }

.nav { position: fixed; bottom: 16px; right: 16px; font: 600 14px Inter, sans-serif; color: var(--gray); }
body.capture .nav { display: none; }
</style>
</head>
<body>
<div id="stage"></div>
<div class="nav">← → листать · F — полный экран</div>
<script src="slides.js"></script>
<script>
const STAR = `<svg class="star spin" viewBox="0 0 100 100"><path fill="#fff" d="M50 2 C53 36 64 47 98 50 C64 53 53 64 50 98 C47 64 36 53 2 50 C36 47 47 36 50 2Z"/></svg>`;
const orb = (cls = "") => `<div class="orb ${cls}"><div class="pop" style="position:absolute;inset:0;animation-delay:.25s"><div class="glow pulse"></div><div class="float" style="position:absolute;inset:0"><div class="squircle">${STAR}</div></div></div></div>`;
const d = (i) => `style="animation-delay:${(0.08 + i * 0.09).toFixed(2)}s"`;
const head = (s) => `<div class="eyebrow in" ${d(0)}>${s.eyebrow}</div><h1><span class="in" ${d(1)}>${s.title[0]}</span><span class="in" ${d(2)}>${s.title[1]}</span></h1>`;

const LAYOUTS = {
  hero: (s) => `<div class="text">${head(s)}<p class="sub in" ${d(3)}>${s.sub}</p></div>${orb()}
    ${s.pills.map(([c, t], i) => `<div class="pill ${c} p${i} in" ${d(4 + i)}><div class="bob" style="display:flex;gap:18px;align-items:center;animation-delay:-${i * 2}s"><span class="dot"></span>${t}</div></div>`).join("")}`,
  chips: (s) => `${head(s)}<div class="grid">${s.chips.map(([c, h, p], i) => `<div class="chip ${c} in" ${d(3 + i)}><div class="head"><span class="dot"></span>${h}</div><p>${p}</p></div>`).join("")}</div>`,
  define: (s) => `${head(s)}<p class="quote in" ${d(3)}>${s.quote}</p><div class="vs">${s.compare.map(([h, p], i) => `<div class="chip in" ${d(4 + i)}><div class="head"><span class="dot ${i ? "pink" : ""}" style="${i ? "" : "background:#bbb"}"></span>${h}</div><p>${p}</p></div>`).join("")}</div>`,
  steps: (s) => `${head(s)}<div class="row">${s.steps.map(([c, tag, h, p], i) => `<div class="step ${c} in" ${d(3 + i)}><span class="tag"><span class="dot"></span>${tag}</span><h3>${h}</h3><p>${p}</p></div>`).join("")}</div>`,
  prompt: (s) => `${head(s)}<div class="cols"><div class="bubble bad in" ${d(3)}><small>✕ Слабо</small>«${s.bad}»</div><div class="bubble good in" ${d(4)}><small>✓ Сильно</small>«${s.good}»</div></div>
    <div class="recipe">${s.recipe.map(([c, t], i) => `<div class="pill ${c} in" ${d(5 + i)}><span class="dot"></span>${t}</div>`).join("")}</div>`,
  final: (s) => `${head(s)}<div class="tasks">${s.tasks.map(([c, t], i) => `<div class="chip ${c} in" ${d(3 + i)}><span class="n">0${i + 1}</span><span class="dot"></span>${t}</div>`).join("")}</div>${orb()}
    <div class="cta in" ${d(7)}><div><div class="lbl">НАБОР ОТКРЫТ</div><div class="nick">@ModeratorAlKifaya</div></div><div class="btn">Записаться</div></div>`,
};

const stage = document.getElementById("stage");
stage.innerHTML = SLIDES.map((s, i) => `<section class="slide ${s.layout}">${LAYOUTS[s.layout](s)}
  <div class="foot"><span>Школа «Аль-Кифая» · Урок 1</span><span>${String(i + 1).padStart(2, "0")} / ${SLIDES.length}</span></div></section>`).join("");
const slides = [...document.querySelectorAll(".slide")];

function fit() { const k = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `scale(${k}) translate(-50%,-50%)`; }
addEventListener("resize", fit); fit();

let cur = 0;
function show(i) {
  cur = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((el, j) => el.classList.toggle("on", j === cur));
  // перезапуск анимаций появления
  slides[cur].querySelectorAll(".in,.pop").forEach((el) => { el.style.animationName = "none"; el.offsetWidth; el.style.animationName = ""; });
  history.replaceState(null, "", "#" + (cur + 1));
}
addEventListener("keydown", (e) => {
  if (["ArrowRight", " ", "PageDown"].includes(e.key)) show(cur + 1);
  if (["ArrowLeft", "PageUp"].includes(e.key)) show(cur - 1);
  if (e.key === "f" || e.key === "F") document.documentElement.requestFullscreen?.();
});
addEventListener("click", (e) => show(cur + (e.clientX > innerWidth / 3 ? 1 : -1)));

// Режим съёмки кадров для видео: ?capture → window.seek(slide, секунды)
if (location.search.includes("capture")) {
  document.body.classList.add("capture");
  window.seek = (i, t) => {
    if (!slides[i].classList.contains("on")) show(i);
    document.getAnimations().forEach((a) => { a.pause(); a.currentTime = t * 1000; });
  };
} else show((parseInt(location.hash.slice(1)) || 1) - 1);
</script>
</body>
</html>
