<style>

<body>
<div id="stage">
  <div class="aurora" id="a1" style="background:#7f98ff"></div><div class="aurora" id="a2" style="background:#ff86c8"></div><div class="aurora" id="a3" style="background:#ffc95e"></div>
</div>
<script src="scenes.js"></script>
<script>
const stage = document.getElementById("stage");
stage.insertAdjacentHTML("beforeend", SCENES.map((s, i) => `<section class="scene" id="sc${i}">${s.html}</section>`).join(""));
const scenesEl = [...document.querySelectorAll(".scene")];
const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (p) => 1 - Math.pow(1 - p, 3);
const back = (p) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };

// Подготовка элементов
const items = scenesEl.map((sc) => [...sc.querySelectorAll("[data-b],[data-o],[data-float],[data-spin],[data-pulse],[data-move]")].map((el) => {
  const d = el.dataset, it = { el, fx: d.fx || (d.b !== undefined ? "up" : null), b: d.b !== undefined ? +d.b : null, d: +(d.d || 0),
    dur: d.dur, o: d.o !== undefined ? +d.o : null, base: d.base || "",
    float: d.float ? d.float.split(" ").map(Number) : null, spin: d.spin ? +d.spin : 0,
    pulse: d.pulse ? d.pulse.split(" ").filter(Boolean).map(Number) : [],
    move: d.move ? d.move.split("|").map((s) => { const [b, xy] = s.split(":"); const [x, y] = xy.split(",").map(Number); return { b: +b, x, y }; }) : null };
  if (it.fx === "type") it.full = Array.from(el.textContent);
  if (it.fx === "count") it.count = d.count.split(",").map(Number);
  if (it.fx === "draw") { it.len = el.getTotalLength(); el.style.strokeDasharray = it.len; }
  if (el.tagName === "I" && !el.className) it.fx = "none";
  return it;
}));

let TL = null;
function setTimeline(tl) { TL = tl; }
function fakeTimeline() {
  let t = 0;
  return { scenes: SCENES.map((s) => { const beats = s.beats.map((_, i) => 0.6 + i * 3.6); const sc = { start: t, dur: beats.at(-1) + 4.5, beats }; t += sc.dur; return sc; }) };
}
const sceneOf = (t) => { let i = TL.scenes.findIndex((s) => t < s.start + s.dur); return i < 0 ? TL.scenes.length - 1 : i; };
function durOf(it, S) {
  const st = S.beats[it.b] + it.d;
  if (it.dur === "beat") { const nb = it.b + 1 < S.beats.length ? S.beats[it.b + 1] : S.dur - 0.8; return Math.max(0.5, nb - st - 0.3); }
  return it.dur ? +it.dur : it.fx === "type" ? 1.2 : it.fx === "pop" ? 0.75 : 0.8;
}

let shown = -1;
function render(t) {
  const i = sceneOf(t), S = TL.scenes[i], lt = t - S.start;
  if (i !== shown) { scenesEl.forEach((el, j) => el.style.display = j === i ? "block" : "none"); shown = i; }
  scenesEl[i].style.opacity = Math.min(1, lt / 0.3, (S.dur - lt) / 0.45);
  // фон
  [[0.05, 0, 300, 200], [0.04, 2, 1300, 600], [0.03, 4, 700, 900]].forEach(([w, ph, x, y], k) =>
    document.getElementById("a" + (k + 1)).style.transform = `translate(${x - 450 + Math.sin(t * w * 6 + ph) * 160}px, ${y - 450 + Math.cos(t * w * 5 + ph) * 120}px)`);

  for (const it of items[i]) {
    let op = 1, tx = 0, ty = 0, sc = 1, rot = 0, extra = "";
    if (it.b !== null && it.fx !== "none") {
      const st = S.beats[it.b] + it.d, p = clamp((lt - st) / durOf(it, S)), e = ease(p), on = lt >= st ? 1 : 0;
      switch (it.fx) {
        case "up": op = e; ty = (1 - e) * 46; break;
        case "down": op = e; ty = -(1 - e) * 46; break;
        case "left": op = e; tx = (1 - e) * 90; break;
        case "right": op = e; tx = -(1 - e) * 90; break;
        case "pop": op = clamp(p * 4); sc = p > 0 ? 0.3 + 0.7 * back(p) : 0.3; break;
        case "fade": op = e; break;
        case "zoom": op = e; sc = 1.4 - 0.4 * e; break;
        case "grow": op = on; extra = ` scaleX(${e})`; break;
        case "draw": op = on; it.el.style.strokeDashoffset = it.len * (1 - e); break;
        case "type": op = on; it.el.textContent = it.full.slice(0, Math.round(it.full.length * p)).join(""); break;
        case "count": op = on; it.el.textContent = Math.round(it.count[0] + (it.count[1] - it.count[0]) * e) + (it.el.dataset.suf || ""); break;
      }
    }
    if (it.o !== null) { const q = ease(clamp((lt - S.beats[it.o]) / 0.45)); op *= 1 - q; ty -= q * 24; }
    for (const pb of it.pulse) { const q = (lt - S.beats[pb]) / 0.7; if (q > 0 && q < 1) sc *= 1 + 0.07 * Math.sin(Math.PI * q); }
    if (!it.pulse.length && it.el.hasAttribute("data-pulse")) sc *= 1 + 0.06 * Math.sin(lt * Math.PI / 1.5);
    if (it.float) ty += it.float[0] * Math.sin(2 * Math.PI * (lt / it.float[1] + it.float[2]));
    if (it.spin) rot += it.spin * lt;
    if (it.move) {
      let x = it.move[0].x, y = it.move[0].y;
      for (const m of it.move.slice(1)) { const q = ease(clamp((lt - S.beats[m.b]) / 1.2)); x += (m.x - x) * q; y += (m.y - y) * q; }
      it.el.style.left = x + "px"; it.el.style.top = y + "px";
    }
    it.el.style.opacity = op;
    if (it.fx !== "draw") {
      const tr = `${it.base} translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px) rotate(${rot.toFixed(2)}deg) scale(${sc.toFixed(4)})${extra}`;
      if (it.el instanceof SVGElement && !(it.el instanceof SVGSVGElement)) { it.el.style.transformBox = "fill-box"; it.el.style.transformOrigin = "center"; }
      it.el.style.transform = tr;
    }
  }
}

// Звуковые события для сборки
function sfxEvents() {
  const ev = [];
  TL.scenes.forEach((S, i) => {
    if (i) ev.push({ t: S.start + 0.05, name: "swish" });
    items[i].forEach((it) => { const n = it.el.dataset.sfx; if (n && it.b !== null) ev.push({ t: S.start + S.beats[it.b] + it.d, name: n, dur: durOf(it, S) }); });
  });
  return ev;
}

function fit() { const k = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `scale(${k}) translate(-50%,-50%)`; }
addEventListener("resize", fit); fit();

if (!location.search.includes("capture")) {
  TL = fakeTimeline();
  let t0 = performance.now() / 1000 - (parseFloat(new URLSearchParams(location.search).get("t")) || 0);
  const loop = () => { render(performance.now() / 1000 - t0); requestAnimationFrame(loop); };
  loop();
