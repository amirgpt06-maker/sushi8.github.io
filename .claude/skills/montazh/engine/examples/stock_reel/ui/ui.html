<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:SF;src:url(fonts/SF-Pro-Display-Thin.otf);font-weight:100}
@font-face{font-family:SF;src:url(fonts/SF-Pro-Display-Light.otf);font-weight:300}
@font-face{font-family:SF;src:url(fonts/SF-Pro-Display-Regular.otf);font-weight:400}
@font-face{font-family:SF;src:url(fonts/SF-Pro-Display-Medium.otf);font-weight:500}

html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent}
#root{position:absolute;left:0;top:0;width:1080px;height:1920px;font-family:SF;overflow:hidden;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
</style></head><body><div id="root"></div>
<script>
const R = document.getElementById('root');
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lin = (t, a, b) => cl((t - a) / (b - a));
const ss = x => x * x * (3 - 2 * x);
const eo = x => 1 - Math.pow(1 - cl(x), 3);
const eo5 = x => 1 - Math.pow(1 - cl(x), 5);
const eio = x => (x = cl(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const spr = x => x <= 0 ? 0 : 1 - Math.exp(-6.5 * x) * Math.cos(9.5 * x);
const mix = (a, b, k) => a + (b - a) * k;
function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647, (s - 1) / 2147483646); }
function el(tag, css, parent, html) { const e = document.createElement(tag); e.style.cssText = css; if (html !== undefined) e.innerHTML = html; (parent || R).appendChild(e); return e; }
const IMG = {};
function img(n) { if (!IMG[n]) { IMG[n] = new Image(); IMG[n].src = 'img/' + n + '.jpg'; } return IMG[n]; }

// ---------- phone ----------
function phone(parent, w = 860, h = 1780, light = false) {
  const cam = el('div', `position:absolute;left:0;top:0;width:1080px;height:1920px;transform-style:preserve-3d`, parent);
  const wrap = el('div', `position:absolute;left:${(1080 - w) / 2}px;top:${(1920 - h) / 2}px;width:${w}px;height:${h}px;border-radius:118px;background:linear-gradient(145deg,#3a3b40,#121214 40%,#26272b);box-shadow:0 70px 140px rgba(0,0,0,.6),0 20px 40px rgba(0,0,0,.35)`, cam);
  el('div', `position:absolute;inset:6px;border-radius:112px;background:#050506`, wrap);
  const scr = el('div', `position:absolute;left:24px;top:24px;right:24px;bottom:24px;border-radius:96px;overflow:hidden;background:${light ? '#f6f4f1' : '#000'}`, wrap);
  el('div', `position:absolute;left:50%;top:30px;width:210px;height:62px;margin-left:-105px;border-radius:32px;background:#000;z-index:60`, scr);
  const glare = el('div', `position:absolute;inset:0;z-index:70;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.10) 45%,rgba(255,255,255,0) 60%);mix-blend-mode:screen`, scr);
  return { cam, wrap, scr, glare, W: w - 48, H: h - 48 };
}
function camSet(c, o) {   // o: {x,y,z,rx,ry,rz,s}
  c.cam.style.transform = `perspective(2600px) translate3d(${o.x || 0}px,${o.y || 0}px,${o.z || 0}px) rotateX(${o.rx || 0}deg) rotateY(${o.ry || 0}deg) rotateZ(${o.rz || 0}deg) scale(${o.s || 1})`;
  if (c.glare) c.glare.style.backgroundPosition = '0 0', c.glare.style.transform = `translateX(${(o.ry || 0) * 18}px)`;
}

// ---------- map ----------
let MAP; const buildMap = () => {
  const S = 3200, cv = document.createElement('canvas'); cv.width = S; cv.height = S; const g = cv.getContext('2d');
  const r = rng(7); const O = S / 2;
  g.fillStyle = '#1c1f25'; g.fillRect(0, 0, S, S);
  const vx = [], hy = []; for (let x = 60; x < S; x += 150 + r() * 70) vx.push(x); for (let y = 60; y < S; y += 140 + r() * 80) hy.push(y);
  // кварталы: здания
  for (let i = 0; i < vx.length - 1; i++) for (let j = 0; j < hy.length - 1; j++) {
    const x0 = vx[i] + 14, x1 = vx[i + 1] - 14, y0 = hy[j] + 14, y1 = hy[j + 1] - 14; const k = r();
    if (k < .07) { g.fillStyle = '#1d2b23'; g.fillRect(x0 - 6, y0 - 6, x1 - x0 + 12, y1 - y0 + 12); continue; }
    g.fillStyle = '#23272f'; g.fillRect(x0, y0, x1 - x0, y1 - y0);
    g.fillStyle = '#2a2f38';
    for (let n = 0; n < 4; n++) { const bx = x0 + r() * (x1 - x0) * .6, by = y0 + r() * (y1 - y0) * .6; g.fillRect(bx, by, 20 + r() * (x1 - bx - 20), 20 + r() * (y1 - by - 20)); }
  }
  // река
  g.strokeStyle = '#14263c'; g.lineWidth = 120; g.beginPath(); for (let x = 0; x <= S; x += 40) { const y = 520 + Math.sin(x / 420) * 140 + x * .12; x ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke();
  const road = (w, c) => { g.strokeStyle = c; g.lineWidth = w; g.lineCap = 'round'; };
  vx.forEach((x, i) => { road(i % 3 ? 10 : 20, i % 3 ? '#30353e' : '#3d434e'); g.beginPath(); g.moveTo(x, 0); g.lineTo(x, S); g.stroke(); });
  hy.forEach((y, i) => { road(i % 3 ? 10 : 20, i % 3 ? '#30353e' : '#3d434e'); g.beginPath(); g.moveTo(0, y); g.lineTo(S, y); g.stroke(); });
  road(26, '#46404a'); g.beginPath(); g.moveTo(0, S * .9); g.lineTo(S, S * .15); g.stroke();
  road(14, '#4a4237'); g.beginPath(); g.moveTo(S * .1, 0); g.lineTo(S * .75, S); g.stroke();
  g.fillStyle = 'rgba(160,166,178,.55)'; g.font = '500 22px SF';
  const names = ['Тверская', 'Садовая', 'Арбат', 'Пресня', 'Мира', 'Лесная', 'Неглинная', 'Петровка', 'Покровка', 'Маросейка'];
  hy.forEach((y, i) => { if (i % 3 == 0) for (let x = 200 + (i * 97) % 300; x < S; x += 900) g.fillText(names[(i + x) % names.length], x, y - 16); });
  return { cv, vx, hy, S };
};
function nearest(arr, v) { let b = arr[0]; for (const a of arr) if (Math.abs(a - v) < Math.abs(b - v)) b = a; return b; }
function routePts(car, dest) { // по сетке: вверх по своей улице -> вбок по поперечной -> вверх к цели
  const yT = nearest(MAP.hy, (car[1] + dest[1]) / 2);
  return [car, [car[0], yT], [dest[0], yT], dest];
}
function plen(p) { let L = 0; for (let i = 1; i < p.length; i++) L += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return L; }
function ppart(p, k) { const L = plen(p) * cl(k); let acc = 0; const out = [p[0]]; for (let i = 1; i < p.length; i++) { const d = Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); if (acc + d >= L) { const q = (L - acc) / d; out.push([mix(p[i - 1][0], p[i][0], q), mix(p[i - 1][1], p[i][1], q)]); return out; } acc += d; out.push(p[i]); } return out; }
function drawMap(cx, W, H, view, routes, car, carAng, pins) {
  // view: {x,y,rot,s, ax,ay}  (ax,ay — экранная точка, куда попадает центр)
  const g = cx; g.save(); g.clearRect(0, 0, W, H); g.fillStyle = '#1c1f25'; g.fillRect(0, 0, W, H);
  g.translate(view.ax, view.ay); g.rotate(view.rot * Math.PI / 180); g.scale(view.s, view.s); g.translate(-view.x, -view.y);
  g.drawImage(MAP.cv, 0, 0);
  for (const rt of routes) {
    if (!rt.pts || rt.pts.length < 2) continue;
    g.globalAlpha = rt.a ?? 1; g.lineJoin = 'round'; g.lineCap = 'round';
    const path = () => { g.beginPath(); rt.pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); };
    g.shadowColor = rt.glow || 'rgba(255,214,10,.7)'; g.shadowBlur = 30; g.strokeStyle = rt.edge || '#7a5a00'; g.lineWidth = 30 / view.s * .9; path(); g.stroke();
    g.shadowBlur = 0; g.strokeStyle = rt.col || '#FFD60A'; g.lineWidth = 20 / view.s * .9; if (rt.dash) g.setLineDash([26, 22]); path(); g.stroke(); g.setLineDash([]);
    g.globalAlpha = 1;
  }
  g.restore();
  const T = (p) => { const a = view.rot * Math.PI / 180, dx = (p[0] - view.x) * view.s, dy = (p[1] - view.y) * view.s; return [view.ax + dx * Math.cos(a) - dy * Math.sin(a), view.ay + dx * Math.sin(a) + dy * Math.cos(a)]; };
  for (const pn of pins) {
    const [x, y] = T(pn.p); g.save(); g.translate(x, y - (pn.lift || 0)); g.globalAlpha = pn.a ?? 1; g.scale(pn.k ?? 1, pn.k ?? 1);
    if (pn.ring) { g.strokeStyle = `rgba(255,214,10,${.6 * (1 - pn.ring)})`; g.lineWidth = 6; g.beginPath(); g.arc(0, 0, 30 + pn.ring * 90, 0, 7); g.stroke(); }
    g.fillStyle = pn.col || '#FF453A'; g.shadowColor = 'rgba(0,0,0,.5)'; g.shadowBlur = 16;
    g.beginPath(); g.arc(0, -62, 34, Math.PI * .8, Math.PI * 2.2); g.lineTo(0, 0); g.closePath(); g.fill(); g.shadowBlur = 0;
    g.fillStyle = '#fff'; g.font = '800 38px SF'; g.textAlign = 'center'; g.textBaseline = 'middle';
    if (pn.q) g.fillText('?', 0, -60); else { g.beginPath(); g.arc(0, -62, 12, 0, 7); g.fill(); }
    g.restore();
  }
  // машина
  const [x, y] = T(car); g.save(); g.translate(x, y); g.rotate((view.rot + carAng) * Math.PI / 180);
  g.fillStyle = 'rgba(10,132,255,.22)'; g.beginPath(); g.arc(0, 0, 70, 0, 7); g.fill();
  g.fillStyle = '#fff'; g.shadowColor = 'rgba(0,0,0,.5)'; g.shadowBlur = 14; g.beginPath(); g.arc(0, 0, 36, 0, 7); g.fill(); g.shadowBlur = 0;
  g.fillStyle = '#0A84FF'; g.beginPath(); g.moveTo(0, -22); g.lineTo(17, 18); g.lineTo(0, 9); g.lineTo(-17, 18); g.closePath(); g.fill();
  g.restore();
  return T;
}
function navChrome(scr, W, H) {
  const cv = el('canvas', `position:absolute;left:0;top:0;width:${W}px;height:${H}px`, scr); cv.width = W; cv.height = H;
  const top = el('div', `position:absolute;left:32px;right:32px;top:120px;height:120px;border-radius:36px;background:rgba(36,38,44,.94);box-shadow:0 14px 40px rgba(0,0,0,.45);display:flex;align-items:center;padding:0 34px;box-sizing:border-box;z-index:20`, scr);
  top.innerHTML = `<svg width="46" height="46" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5" stroke="#9a9ca3" stroke-width="2.4" fill="none"/><path d="M15 15l5.5 5.5" stroke="#9a9ca3" stroke-width="2.6" stroke-linecap="round"/></svg>`;
  const txt = el('div', `margin-left:22px;font:500 50px SF;color:#fff;white-space:nowrap;letter-spacing:-.5px`, top);
  const caret = el('span', `display:inline-block;width:4px;height:52px;background:#0A84FF;vertical-align:-8px;margin-left:3px;border-radius:2px`, null);
  return { cv, cx: cv.getContext('2d'), top, txt, caret };
}

// ===================== СЦЕНЫ =====================
const SC = {};

// --- навигатор: «куда-нибудь», маршрут скачет ---
SC.nav_chaos = {
  build() {
    this.P = phone(R); const { scr, W, H } = this.P; this.W = W; this.H = H;
    this.N = navChrome(scr, W, H);
    this.chip = el('div', `position:absolute;left:50%;top:268px;transform:translateX(-50%);padding:16px 30px;border-radius:40px;background:rgba(255,159,10,.95);font:700 34px SF;color:#1a1200;white-space:nowrap;display:flex;align-items:center;gap:16px;z-index:21;box-shadow:0 10px 30px rgba(0,0,0,.4)`, scr, `<span id="spn" style="display:inline-block;width:30px;height:30px;border-radius:50%;border:5px solid rgba(26,18,0,.25);border-top-color:#1a1200;box-sizing:border-box"></span>Перестраиваю маршрут…`);
    this.card = el('div', `position:absolute;left:0;right:0;bottom:0;height:360px;background:rgba(28,30,35,.97);border-radius:56px 56px 0 0;z-index:20;padding:44px 56px;box-sizing:border-box`, scr);
    this.eta = el('div', `font:800 104px SF;color:#fff;letter-spacing:-2px`, this.card, '?? мин');
    this.sub = el('div', `font:500 40px SF;color:#9a9ca3;margin-top:6px`, this.card, '?? км · маршрут не найден');
    const r = rng(11); this.car = [MAP.vx[11], MAP.hy[14]];
    this.jumps = [0.12, 0.36, 0.58, 0.80, 0.99, 1.17, 1.34, 1.50];
    this.dests = this.jumps.map(() => [nearest(MAP.vx, this.car[0] + (r() - .5) * 1700), MAP.hy[14 - 2 - Math.floor(r() * 6)] + (r() - .5) * 40]);
    this.rots = this.jumps.map(() => (r() - .5) * 40); this.pans = this.jumps.map(() => [(r() - .5) * 260, (r() - .5) * 200]);
    this.etas = ['47 мин', '3 ч 12 мин', '9 мин', '?? мин', '1 ч 05 мин', '26 мин', '?? мин', '2 ч 40 мин'];
  },
  update(t) {
    const { W, H } = this; let k = -1; this.jumps.forEach((j, i) => { if (t >= j) k = i; });
    const tj = k >= 0 ? t - this.jumps[k] : 0, e = eo5(tj / .14);
    const pr = k >= 1 ? this.rots[k - 1] : -14, cr = k >= 0 ? this.rots[k] : -14;
    const pp = k >= 1 ? this.pans[k - 1] : [0, 0], cp = k >= 0 ? this.pans[k] : [0, 0];
    const rot = mix(pr, cr, e) + Math.sin(t * 23) * (k >= 3 ? 1.2 : 0);
    const view = { x: this.car[0] + mix(pp[0], cp[0], e), y: this.car[1] - 420 + mix(pp[1], cp[1], e), rot, s: .78, ax: W / 2, ay: H * .5 };
    const routes = [], pins = [];
    if (k >= 1) routes.push({ pts: routePts(this.car, this.dests[k - 1]), a: .5 * (1 - e), dash: true });
    if (k >= 0) { routes.push({ pts: ppart(routePts(this.car, this.dests[k]), eo(tj / .16)) }); pins.push({ p: this.dests[k], q: true, k: spr(tj / .25), lift: 0 }); }
    drawMap(this.N.cx, W, H, view, routes, this.car, 0, pins);
    // поиск: «куда-нибудь»
    const s = 'куда-нибудь', n = Math.floor(cl((t - .40) / .055, 0, s.length));
    this.N.txt.textContent = n ? s.slice(0, n) : ''; if (!n) this.N.txt.innerHTML = '<span style="color:#7d8088">Куда едем?</span>';
    this.N.txt.appendChild(this.N.caret); this.N.caret.style.opacity = (Math.floor(t * 3.4) % 2 || n < s.length) ? 1 : 0;
    this.chip.style.opacity = k >= 0 ? 1 : 0; this.chip.style.transform = `translateX(-50%) scale(${k >= 0 ? .9 + .1 * spr(tj / .3) : .8})`;
    document.getElementById('spn').style.transform = `rotate(${t * 900}deg)`;
    this.eta.textContent = k >= 0 ? this.etas[k] : '?? мин'; this.eta.style.transform = `translateY(${(1 - eo(tj / .12)) * 20}px)`;
    this.eta.style.color = k >= 0 && tj < .08 ? '#FF9F0A' : '#fff';
    const pz = t / 1.67;
    camSet(this.P, { s: 1.06 + .08 * pz + (k >= 0 ? .012 * Math.sin(tj * 40) * Math.exp(-tj * 10) : 0), rx: 9 - 2 * pz, ry: -13 + 4 * pz, rz: 3 + (k >= 3 ? Math.sin(t * 31) * .6 : 0), y: 40 });
  }
};

// --- навигатор: вводим адрес -> один чистый маршрут ---
SC.nav_addr = {
  build() {
    this.P = phone(R); const { scr, W, H } = this.P; this.W = W; this.H = H;
    this.N = navChrome(scr, W, H);
    this.sug = el('div', `position:absolute;left:32px;right:32px;top:256px;border-radius:30px;background:rgba(36,38,44,.97);z-index:19;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.45)`, scr,
      `<div style="display:flex;align-items:center;gap:26px;padding:30px 34px"><div style="width:64px;height:64px;border-radius:50%;background:#FF453A;display:flex;align-items:center;justify-content:center"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z" fill="#fff"/></svg></div><div><div style="font:600 44px SF;color:#fff">Тверская, 7</div><div style="font:400 34px SF;color:#9a9ca3;margin-top:4px">Москва · 4,8 км</div></div></div>`);
    this.rip = el('div', `position:absolute;left:150px;top:330px;width:40px;height:40px;margin:-20px;border-radius:50%;background:rgba(255,255,255,.35);z-index:30`, scr);
    // клавиатура
    const kb = this.kb = el('div', `position:absolute;left:0;right:0;bottom:0;height:640px;background:rgba(43,44,48,.98);z-index:25;padding:26px 10px 0;box-sizing:border-box`, scr);
    const rows = ['йцукенгшщзх', 'фывапролджэ', 'ячсмитьбю'];
    this.keys = {};
    rows.forEach((row, ri) => { const rw = el('div', `display:flex;justify-content:center;gap:10px;margin-bottom:22px`, kb);
      if (ri == 2) el('div', `width:104px;height:118px;border-radius:14px;background:#5a5b60`, rw);
      for (const c of row) { const k = el('div', `width:62px;height:118px;border-radius:14px;background:#6b6c71;color:#fff;font:400 50px SF;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.4)`, rw, c); this.keys[c] = k; }
      if (ri == 2) el('div', `width:104px;height:118px;border-radius:14px;background:#5a5b60`, rw); });
    const br = el('div', `display:flex;justify-content:center;gap:10px`, kb);
    el('div', `width:150px;height:118px;border-radius:14px;background:#5a5b60;color:#fff;font:400 40px SF;display:flex;align-items:center;justify-content:center`, br, '123');
    this.keys[' '] = el('div', `width:440px;height:118px;border-radius:14px;background:#6b6c71;color:#fff;font:400 38px SF;display:flex;align-items:center;justify-content:center`, br, 'пробел');
    this.keys[','] = this.keys[' ']; this.keys['7'] = el('div', `width:150px;height:118px;border-radius:14px;background:#0A84FF;color:#fff;font:600 38px SF;display:flex;align-items:center;justify-content:center`, br, 'Найти');
    this.pop = el('div', `position:absolute;width:110px;height:150px;border-radius:22px;background:#8a8b90;color:#fff;font:400 76px SF;display:flex;align-items:center;justify-content:center;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.4)`, scr);
    this.card = el('div', `position:absolute;left:0;right:0;bottom:0;height:420px;background:rgba(28,30,35,.97);border-radius:56px 56px 0 0;z-index:22;padding:48px 56px;box-sizing:border-box`, scr,
      `<div style="display:flex;align-items:baseline;gap:22px"><span style="font:800 108px SF;color:#30D158;letter-spacing:-2px">12 мин</span><span style="font:500 42px SF;color:#9a9ca3">4,8 км</span></div>
       <div style="font:500 40px SF;color:#9a9ca3;margin-top:4px">Прибытие в 21:47 · без пробок</div>
       <div style="margin-top:34px;height:120px;border-radius:60px;background:#FFD60A;color:#1a1200;font:700 50px SF;display:flex;align-items:center;justify-content:center">Поехали</div>`);
    this.car = [MAP.vx[11], MAP.hy[14]]; this.dest = [MAP.vx[15], MAP.hy[7] + 30];
    this.route = routePts(this.car, this.dest);
    this.text = 'тверская, 7'; this.T0 = .05; this.dt = .055;
  },
  update(t) {
    const { W, H } = this;
    const zoomOut = eio(lin(t, .78, 1.25));
    const view = { x: mix(this.car[0], (this.car[0] + this.dest[0]) / 2, zoomOut), y: mix(this.car[1] - 300, (this.car[1] + this.dest[1]) / 2 + 120, zoomOut), rot: mix(-10, -4, zoomOut), s: mix(.9, .62, zoomOut), ax: W / 2, ay: H * mix(.42, .44, zoomOut) };
    const rk = eio(lin(t, .82, 1.12)), pins = [], routes = [];
    if (rk > 0) routes.push({ pts: ppart(this.route, rk) });
    if (t > 1.0) { const q = (t - 1.0) / .3; pins.push({ p: this.dest, k: spr(q), lift: (1 - eo(q)) * 60, ring: cl((t - 1.08) / .7) < 1 && t > 1.08 ? cl((t - 1.08) / .7) : 0 }); }
    drawMap(this.N.cx, W, H, view, routes, this.car, 0, pins);
    // набор
    const n = Math.floor(cl((t - this.T0) / this.dt, 0, this.text.length));
    const shown = n ? 'Т' + this.text.slice(1, n) : '';
