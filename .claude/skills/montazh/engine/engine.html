<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!--
  Наш стиль монтажа — движок оверлея. build(data) строит сцену из cues.json, render(t) рисует кадр и
  возвращает fx (то, что делает compose.py поверх видео: размытие фона, наезд, стеклянная линза, засветка),
  events() — список звуков с точными временами (печать по буквам, стекло, клики, деньги...).
-->
<style>
@font-face { font-family: "Inter"; src: url("fonts/Inter.ttf"); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; background: transparent; overflow: hidden; font-family: "Inter", "SF Pro Display", sans-serif; color: #fff;
  -webkit-font-smoothing: antialiased; font-feature-settings: "ss01", "cv11"; }
.abs { position: absolute; left: 0; top: 0; }
.emo { font-family: "Noto Color Emoji"; line-height: 1; }
.shadowed { text-shadow: 0 2px 18px rgba(0,0,0,.28), 0 1px 3px rgba(0,0,0,.18); }

/* стопка слов: мелкое слово — КЛЮЧЕВОЕ — мелкое слово */
.block { position: absolute; display: inline-flex; flex-direction: column; white-space: nowrap; transform-origin: 50% 50%; }
.line { display: block; line-height: .98; }
.line.left { text-align: left; } .line.center { text-align: center; } .line.right { text-align: right; }
.sz-s  { font-size: 40px; font-weight: 400; letter-spacing: -.01em; margin: 0 4px -2px; }
.sz-m  { font-size: 72px; font-weight: 500; letter-spacing: -.035em; }
.sz-l  { font-size: 98px; font-weight: 600; letter-spacing: -.045em; line-height: .9; }
.sz-caps { font-size: 82px; font-weight: 800; letter-spacing: -.02em; text-transform: uppercase; line-height: .92; }
.sz-xl { font-size: 206px; font-weight: 700; letter-spacing: -.045em; line-height: .9; }
.sz-label { font-size: 48px; font-weight: 400; letter-spacing: -.01em; }
.w { display: inline-block; white-space: pre; }
/* «Кино-типографика»: разреженное мелкое / ЖИРНОЕ / курсив с эхом / подстрочник / тег в скобках / абзац */
.sz-sp   { font-size: 40px; font-weight: 400; letter-spacing: .42em; margin-right: -.42em; text-transform: lowercase; line-height: 1.5; }
.sz-hb   { font-size: 118px; font-weight: 800; letter-spacing: -.05em; line-height: .86; }
.sz-it   { font-size: 118px; font-weight: 800; font-style: italic; letter-spacing: -.045em; line-height: .86;
           text-shadow: -7px 0 0 rgba(255,255,255,.22), -14px 0 0 rgba(255,255,255,.09), 0 2px 18px rgba(0,0,0,.3); }
.sz-sub  { font-size: 34px; font-weight: 500; letter-spacing: .01em; line-height: 1.35; }
.sz-tag  { font-size: 28px; font-weight: 500; letter-spacing: .22em; line-height: 1.6; }
.sz-para { font-size: 52px; font-weight: 600; letter-spacing: -.04em; line-height: .98; }
.para { position: absolute; white-space: nowrap; }
.flash .sz-sp { font-size: 48px; }
.mark { position: absolute; left: 0; width: 1080px; text-align: center; }
.mark .n { font-size: 27px; font-weight: 500; letter-spacing: .14em; font-family: "DejaVu Sans Mono", monospace; }
.mark .s { font-size: 12px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; opacity: .75; margin-top: 6px; font-family: "DejaVu Sans Mono", monospace; }
.w.b { font-weight: 800; }
.ch { display: inline-block; white-space: pre; }

/* карточка с фото */
.cardbox { position: absolute; left: 192px; top: 612px; width: 696px; height: 696px; border-radius: 52px; overflow: hidden; background: #f4f4f6;
  box-shadow: 0 40px 90px rgba(0,0,0,.38), 0 8px 24px rgba(0,0,0,.22); }
.cardbox img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cardbox .emo { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 380px; }
.cardbox::after { content: ""; position: absolute; inset: 0; border-radius: 52px; box-shadow: inset 0 0 0 2px rgba(255,255,255,.35), inset 0 2px 0 rgba(255,255,255,.45); }
.persp { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; perspective: 1400px; }
.clabel { position: absolute; left: 0; width: 1080px; text-align: center; font-size: 56px; font-weight: 400; letter-spacing: -.015em; white-space: nowrap; }

/* вспышка: белый/чёрный экран с печатным текстом */
.flash { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
.flash .txt { position: absolute; left: 0; width: 1080px; top: 922px; text-align: center; font-size: 62px; font-weight: 400; white-space: nowrap; }

/* фокус-рамка из четырёх стрелок */
.corner { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; }

/* призыв */
.chev { position: absolute; width: 64px; height: 40px; margin-left: -32px; }

.bill { position: absolute; left: 0; top: 0; font-family: "Noto Color Emoji"; line-height: 1; will-change: transform; }
/* ===== «Белый Apple-экран» (white board): SF Pro из пака пользователя (engine/local/fonts), иначе Inter ===== */
@font-face { font-family: "SF"; src: url("local/fonts/SF-Pro-Display-Light.otf"); font-weight: 300; }
@font-face { font-family: "SF"; src: url("local/fonts/SF-Pro-Display-Regular.otf"); font-weight: 400; }
@font-face { font-family: "SF"; src: url("local/fonts/SF-Pro-Display-Medium.otf"); font-weight: 500; }
@font-face { font-family: "SF"; src: url("local/fonts/SF-Pro-Display-Semibold.otf"); font-weight: 600; }
@font-face { font-family: "SF"; src: url("local/fonts/SF-Pro-Display-Bold.otf"); font-weight: 700; }
@font-face { font-family: "SF"; src: url("local/fonts/SF-Pro-Display-Heavy.otf"); font-weight: 800; }
@font-face { font-family: "SF"; src: url("local/fonts/SF-Pro-Display-Black.otf"); font-weight: 900; }
.wbf { font-family: "SF", "Inter", sans-serif; color: #0b0b0d; }
.wbline { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; line-height: 1; }
.wbch { display: inline-block; white-space: pre; transform-origin: 50% 80%; }
.wbw { display: inline-block; white-space: pre; }
.pill { position: absolute; padding: 10px 30px 13px; border-radius: 999px; color: #fff; font-weight: 700; white-space: nowrap; line-height: 1;
  background: linear-gradient(180deg, #f3846a, #ea5b40); box-shadow: 0 8px 22px rgba(234, 91, 64, .35), inset 0 1px 0 rgba(255,255,255,.35); }
.tile { position: absolute; border-radius: 64px; overflow: hidden; box-shadow: 0 30px 70px rgba(30, 30, 60, .16), 0 6px 18px rgba(30,30,60,.08), inset 0 0 0 1.5px rgba(255,255,255,.7); }
.tile .in { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.tile img { max-width: 86%; max-height: 86%; object-fit: contain; }
.sel { position: absolute; background: rgba(120, 170, 245, .38); }
.selh { position: absolute; width: 4px; background: #1f6ef5; }
.selh::after { content: ""; position: absolute; left: -9px; width: 22px; height: 22px; border-radius: 50%; background: #1f6ef5; }
.selh.a::after { top: -18px; } .selh.b::after { bottom: -18px; }
.dock { position: absolute; height: 128px; border-radius: 40px; background: linear-gradient(180deg, #1c1c1e, #050506); box-shadow: 0 18px 40px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.12);
  display: flex; align-items: center; padding: 0 22px; gap: 22px; }
.dock .fold { font-family: "Noto Color Emoji"; font-size: 84px; line-height: 1; }
.dock .lab { height: 78px; border-radius: 24px; background: #fff; color: #0b0b0d; display: flex; align-items: center; padding: 0 34px; font-weight: 600; font-size: 40px; white-space: nowrap; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs id="defs">
    <filter id="glassout" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence id="gturb" type="fractalNoise" baseFrequency="0.006 0.018" numOctaves="1" seed="7" result="n"/>
      <feDisplacementMap id="gdisp" in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur id="gblur" in="d" stdDeviation="0"/>
    </filter>
  </defs>
</svg>
<div id="root"></div>
<script>
const W = 1080, H = 1920;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const eOut = (k) => 1 - Math.pow(1 - clamp(k), 3);
const eIn = (k) => Math.pow(clamp(k), 3);
const eIO = (k) => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
// пружина Apple: быстрый выход, лёгкий перелёт ~4%, успокоение
const spring = (k) => { k = clamp(k); return 1 - Math.exp(-6.2 * k) * Math.cos(7.2 * k); };
function rng(seed) { let s = seed >>> 0 || 1; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const KEYS = ["key1", "key2", "key3", "key4"];

let D, EV, ITEMS, FILT = 0, root;
const el = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; (parent || root).appendChild(e); return e; };
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");

// направленное размытие (смаз в движении) — отдельный SVG-фильтр на элемент
function motionBlur(node) {
  const id = "mb" + (FILT++);
  const f = document.createElementNS("http://www.w3.org/2000/svg", "filter");
  f.setAttribute("id", id); f.setAttribute("x", "-50%"); f.setAttribute("y", "-50%"); f.setAttribute("width", "200%"); f.setAttribute("height", "200%");
  const g = document.createElementNS("http://www.w3.org/2000/svg", "feGaussianBlur");
  g.setAttribute("stdDeviation", "0 0"); f.appendChild(g); document.getElementById("defs").appendChild(f);
  return (bx, by) => { if (bx < .3 && by < .3) { node.style.filter = ""; return; } g.setAttribute("stdDeviation", `${bx.toFixed(1)} ${by.toFixed(1)}`); node.style.filter = `url(#${id})`; };
}

// --- якорь: лицо говорящего (из anchor.py); текст держится под подбородком и плавно ходит за головой ---
function face(t) {
  const A = D.anchor;
  const def = { cx: W / 2, cy: 820, w: 420, h: 520 };
  if (!A || !A.f || !A.f.length) return def;
  const i = clamp(Math.round(t * A.fps), 0, A.f.length - 1);
  const f = A.f[i];
  return f ? { cx: f[0], cy: f[1], w: f[2], h: f[3] } : def;
}
function chinPos(t, it) {
  if (it.pos) return { x: it.pos[0], y: it.pos[1] };
  const f = face(t);
  return { x: clamp(f.cx, 330, 750), y: clamp(f.cy + 0.80 * f.h, 1000, 1560) };
}

// --- раскрытие слова: мягкая градиентная шторка слева направо + расфокус -> резкость (как в референсе) ---
function wordReveal(span, k) {
  k = clamp(k);
  if (k >= 1) { span.style.webkitMaskImage = ""; span.style.filter = ""; span.style.opacity = 1; return; }
  const p = k * 150 - 25;
  span.style.webkitMaskImage = `linear-gradient(90deg, #000 ${p - 25}%, rgba(0,0,0,.35) ${p}%, transparent ${p + 25}%)`;
  span.style.filter = `blur(${((1 - k) * 7).toFixed(1)}px)`;
  span.style.opacity = k <= 0 ? 0 : 1;
}
const wordDur = (w) => clamp(0.03 * w.length + 0.08, 0.14, 0.42);

// строки: [{size, align, words:[[текст, t, "b"|"a"]...]}] или {size, text, t}
function normLines(lines, t0) {
  return lines.map((L) => {
    const words = L.words || String(L.text).split(" ").map((w, i) => [w, (L.t != null ? L.t : t0) + i * 0.16]);
    return { size: L.size || "m", align: L.align || "center", color: L.color, words, type: L.type, step: L.step };
  });
}
function buildLines(parent, lines, cls = "") {
  const spans = [];
  for (const L of lines) {
    const ln = el("div", `line ${L.align} sz-${L.size} ${cls}`, parent);
    if (L.color) ln.style.color = L.color;
    if (L.type) {                       // строка печатается по буквам с курсором «|»
      const text = L.words.map((x) => x[0]).join(" ");
      const s = el("span", "w", ln, "");
      spans.push({ s, t: L.words[0][1], w: text, typed: true, step: L.step || 0.045 });
      continue;
    }
    L.words.forEach(([w, t, st], j) => {
      const s = el("span", "w" + (st === "b" ? " b" : ""), ln, esc(w) + (j < L.words.length - 1 ? " " : ""));
      if (st === "a") s.style.color = D.accent || "#F28C28";
      spans.push({ s, t, w });
    });
  }
  return spans;
}
// «Кино»-появление слова: из крупного расфокуса (scale 1.18, blur 14) в резкость, 0.28 с
function cinemaReveal(span, k) {
  k = clamp(k);
  if (k >= 1) { span.style.transform = ""; span.style.filter = ""; span.style.opacity = 1; return; }
  const e = eOut(k);
  span.style.opacity = clamp(k * 2.2);
  span.style.filter = `blur(${((1 - e) * 14).toFixed(1)}px)`;
  span.style.transform = `translateY(${((1 - e) * 10).toFixed(1)}px) scale(${(1 + 0.18 * (1 - e)).toFixed(3)})`;
}
function typedReveal(sp, t) {
  const n = clamp(Math.floor((t - sp.t) / sp.step) + 1, 0, sp.w.length);
  const done = sp.t + sp.w.length * sp.step;
  const cur = t >= sp.t && (t < done + 0.7) && (t < done || Math.floor(t * 2.2) % 2 === 0);
  sp.s.textContent = sp.w.slice(0, t < sp.t ? 0 : n) + (cur ? "|" : "");
  sp.s.style.opacity = t < sp.t ? 0 : 1;
}
function reveal(sp, t, mode) {
  if (sp.typed) return typedReveal(sp, t);
  const k = (t - sp.t) / (mode === "cinema" ? 0.28 : wordDur(sp.w));
  return mode === "cinema" ? cinemaReveal(sp.s, k) : wordReveal(sp.s, k);
}

function typeEvents(text, t0, step, g, kind = "key") {
  const R = rng(Math.round(t0 * 1000));
  [...text].forEach((c, i) => { if (c.trim()) EV.push({ t: +(t0 + i * step).toFixed(3), s: kind === "key" ? KEYS[Math.floor(R() * 4)] : kind, g: g * (0.8 + 0.4 * R()) }); });
}

// ======================= элементы =======================
const MAKE = {};

// Живые субтитры под подбородком: «этот / Детский / набор»
MAKE.words = (it) => {
  const box = el("div", "abs");
  const blk = el("div", "block shadowed", box);
  const lines = normLines(it.lines, it.t);
  const spans = buildLines(blk, lines);
  const mb = motionBlur(blk);
  if (typeof it.sfx === "string") EV.push({ t: it.t, s: it.sfx, g: 0.22 });
  else if (!it.sound && it.sfx !== false && it.fx !== "cinema") EV.push({ t: it.t, s: "blockpop", g: 1.4, v: 1 });   // новая подпись — поп (как в референсах)
  if (it.fx === "cinema" && it.sfx !== false) {
    // как в референсах 4 и 9: поп на появлении блока, тише — на каждой добавочной строке, «Type» — на печати, отдельный звук — на теге.
    // g — относительно громкости голоса (v:1): 1.0 = на уровне голоса
    lines.forEach((L, j) => {
      const t0 = L.words[0][1];
      const role = L.size === "tag" ? ["tagpop", 0.85] : L.type ? ["typeone", 0.7] : j === 0 || t0 - lines[0].words[0][1] < 0.12 ? ["blockpop", 1.4] : ["linepop", 0.56];
      if (j > 0 && role[0] === "blockpop") return;              // строки, появившиеся вместе с первой, — один звук на блок
      EV.push({ t: t0, s: role[0], g: role[1], v: 1 });
    });
  } else {
    for (const sp of spans) if (sp.typed && it.sfxType !== false) {
      if (it.sfxType === "one") EV.push({ t: sp.t, s: "key1", g: 0.22 }); else typeEvents(sp.w, sp.t, sp.step, 0.1);
    }
  }
  if (it.fx === "cinema" && !it.pos && !it.anchor) it.pos = [540, 1060];
  if (it.exit === "swipe") EV.push({ t: it.end - 0.14, s: "click2", g: 0.16 });
  return (t) => {
    if (t < it.t - 0.05 || t > it.end + 0.05) { box.style.display = "none"; return; }
    box.style.display = "";
    for (const sp of spans) reveal(sp, t, it.fx);
    const p = chinPos(t, it);
    const rise = it.fx === "cinema" ? 0 : (1 - eOut((t - it.t) / 0.35)) * 16;
    let dx = 0, op = 1, bx = 0;
    const xd = it.fx === "cinema" ? 0.22 : 0.16;
    const ex = clamp((t - (it.end - xd)) / xd);
    let sc = 1;
    if (ex > 0) {
      if (it.exit === "swipe") { const e = eIn(ex); dx = -260 * e; bx = 26 * e; op = 1 - e; }
      else { op = 1 - eIn(ex); bx = 0; blk.style.filter = `blur(${(ex * (it.fx === "cinema" ? 16 : 8)).toFixed(1)}px)`; if (it.fx === "cinema") sc = 1 - 0.04 * ex; }
    } else if (it.exit !== "swipe") blk.style.filter = "";
    if (it.exit === "swipe" || ex <= 0) mb(bx, 0);
    blk.style.opacity = op;
    blk.style.left = "0px"; blk.style.top = "0px";
    const r = blk.getBoundingClientRect();
    blk.style.transform = `translate(${(p.x - r.width / 2 + dx).toFixed(1)}px, ${(p.y - r.height / 2 + rise).toFixed(1)}px) scale(${sc.toFixed(3)})`;
  };
};

// «Караоке»-абзац: вся фраза видна приглушённо, сказанные слова становятся белыми (выравнивание влево/вправо, сбоку от человека)
MAKE.para = (it) => {
  if (it.sfx !== false) EV.push({ t: it.t, s: "blockpop", g: 1.4, v: 1 });   // новый абзац — как новая подпись
  const box = el("div", "para shadowed");
  box.style.textAlign = it.align || "left";
  const spans = [];
  it.lines.forEach((ln) => {
    const d = el("div", "line sz-para", box);
    if (it.size) d.style.fontSize = it.size + "px";
    ln.forEach(([w, tw, st], j) => { const sp = el("span", "w" + (st === "b" ? " b" : ""), d, esc(w) + (j < ln.length - 1 ? " " : "")); spans.push({ s: sp, t: tw }); });
  });
  return (t) => {
    if (t < it.t - 0.05 || t > it.end) { box.style.display = "none"; return; }
    box.style.display = "";
    for (const { s: sp, t: tw } of spans) { const k = clamp((t - tw) / 0.12); sp.style.opacity = lerp(it.dim ?? 0.32, 1, k); }
    const a = eOut((t - it.t) / 0.25), ex = clamp((t - (it.end - 0.2)) / 0.2);
    box.style.opacity = a * (1 - eIn(ex));
    box.style.filter = `blur(${((1 - a) * 10 + ex * 12).toFixed(1)}px)`;
    const r = box.getBoundingClientRect();
    const [x, y] = it.pos || [540, 1000];
    const ax = (it.align || "left") === "left" ? 0 : (it.align === "right" ? r.width : r.width / 2);
    box.style.transform = `translate(${(x - ax).toFixed(1)}px, ${(y - r.height / 2).toFixed(1)}px)`;
  };
};

// Фирменная подпись-водяной знак внизу: имя + мелкая строка
MAKE.mark = (it) => {
  const box = el("div", "mark");
  box.style.top = (it.y ?? 1585) + "px";
  if (it.color) box.style.color = it.color;
  el("div", "n", box, esc(it.name || ""));
  if (it.sub) el("div", "s", box, esc(it.sub));
  return (t) => {
    box.style.display = t < it.t || t > it.end ? "none" : "";
    box.style.opacity = (it.opacity ?? 0.85) * clamp((t - it.t) / 0.3);
  };
};

// Нижний тёмный градиент под субтитры (читаемость без плашек)
MAKE.shade = (it) => {
  const box = el("div", "abs");
  box.style.width = "1080px"; box.style.height = "1920px";
  const f = it.from ?? 50, a = it.strength ?? 0.6;
  box.style.background = `linear-gradient(180deg, rgba(0,0,0,0) ${f}%, rgba(0,0,0,${a * 0.5}) ${f + 18}%, rgba(0,0,0,${a}) 100%)`;
  return (t) => { const k = Math.min(clamp((t - it.t) / 0.3), clamp((it.end - t) / 0.3)); box.style.display = k > 0 ? "" : "none"; box.style.opacity = k; };
};

// Силуэт: человек залит цветом (заставка «тёмная фигура» в первом кадре) — делает compose.py по маске
MAKE.silhouette = (it) => (t, fx) => {
  if (t < it.t || t > it.end) return;
  const f = it.fade ?? 0.12;
  fx.sil = Math.min(1, (it.end - t) / f, 1);
  fx.silColor = it.color || "#000000";
};

// Замена фона за человеком (картинка или видео) — делает compose.py по маске
MAKE.bg = (it) => (t, fx) => {
  if (t < it.t || t > it.end) return;
  const f = it.fade ?? 0.15;
  fx.bg = { src: it.src, a: Math.min(1, (t - it.t) / f, (it.end - t) / f), t: t - it.t, dim: it.dim ?? 0 };
};

// Призыв в конце: «ОТПРАВЬ» / «"+"» / прыгающая стрелка вниз
MAKE.cta = (it) => {
  const box = el("div", "abs");
  const blk = el("div", "block shadowed", box);
  const spans = buildLines(blk, normLines([{ size: "caps", text: it.text, t: it.t }, ...(it.sub ? [{ size: "s", text: it.sub, t: it.t + 0.25 }] : [])]));
  const ch = el("div", "chev", box, `<svg viewBox="0 0 64 40" width="64" height="40"><path d="M10 10 L32 30 L54 10" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
  if (it.sfx !== false && !it.sound) EV.push({ t: it.t, s: "blockpop", g: 1.4, v: 1 });   // призыв — поп
  return (t) => {
    if (t < it.t - 0.05 || t > it.end) { box.style.display = "none"; return; }
    box.style.display = "";
    for (const { s, t: tw, w } of spans) wordReveal(s, (t - tw) / wordDur(w));
    const p = chinPos(t, it);
    const r = blk.getBoundingClientRect();
    blk.style.transform = `translate(${(p.x - r.width / 2).toFixed(1)}px, ${(p.y - r.height / 2).toFixed(1)}px)`;
    const k = clamp((t - it.t - 0.35) / 0.3);
    ch.style.opacity = k;
    ch.style.left = p.x + "px";
    ch.style.top = (p.y + r.height / 2 + 34 + Math.sin((t - it.t) * Math.PI * 2 / 0.9) * 9 + (1 - eOut(k)) * -20).toFixed(1) + "px";
    ch.style.filter = "drop-shadow(0 2px 10px rgba(0,0,0,.3))";
  };
};

// Фокус-рамка: четыре стрелки к центру лица, раскрываются к глазам/подбородку, в конце схлопываются
MAKE.focus = (it) => {
  const box = el("div", "abs");
  const cs = [[-1, -1], [1, -1], [-1, 1], [1, 1]].map(([sx, sy]) => {
    const c = el("div", "corner", box, `<svg viewBox="0 0 46 46" width="46" height="46"><g fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"
      transform="rotate(${sx < 0 ? (sy < 0 ? 0 : -90) : (sy < 0 ? 90 : 180)} 23 23)"><path d="M8 8 L34 34"/><path d="M34 16 L34 34 L16 34"/></g></svg>`);
    c.style.filter = "drop-shadow(0 1px 6px rgba(0,0,0,.35))";
    return { c, sx, sy };
  });
  EV.push({ t: it.t, s: "focus", g: 0.10 });
  return (t) => {
    if (t < it.t || t > it.end) { box.style.display = "none"; return; }
    box.style.display = "";
    const f = face(t);
    const open = eOut((t - it.t) / 0.32) * (1 - eIO((t - (it.end - 0.28)) / 0.28));
    const rx = lerp(14, 0.30 * f.w, open), ry = lerp(14, 0.27 * f.h, open);
    const op = clamp((t - it.t) / 0.08) * (1 - clamp((t - (it.end - 0.1)) / 0.1));
    for (const { c, sx, sy } of cs) {
      c.style.left = (f.cx + sx * rx).toFixed(1) + "px"; c.style.top = (f.cy - 0.02 * f.h + sy * ry).toFixed(1) + "px";
      c.style.opacity = op; c.style.transform = `scale(${lerp(0.55, 1, open).toFixed(3)})`;
    }
  };
};

// Размытие фона (только fx для compose.py)
MAKE.blur = (it) => (t, fx) => {
  const a = it.in ?? 0.28, b = it.out ?? 0.32;
  const k = Math.min(eIO((t - it.t) / a), 1 - eIO((t - (it.end - b)) / b));
  if (k > 0) { fx.blur = Math.max(fx.blur, k * (it.amount ?? 1)); fx.dim = Math.max(fx.dim, k * (it.dim ?? 0.5)); }
};

// Наезд камеры: резкий (cut) или плавный
MAKE.zoom = (it) => {
  if (it.ramp && it.sfx) EV.push({ t: it.t - 0.05, s: typeof it.sfx === "string" ? it.sfx : "whoosh", g: 0.24 });   // звук на наезде — только если задан
  return zoomFx(it);
};
const zoomFx = (it) => (t, fx) => {
  if (t < it.t || t > it.end) return;
  const s = it.scale ?? 1.12;
  const k = it.ramp ? eIO((t - it.t) / it.ramp) * (1 - eIO((t - (it.end - it.ramp)) / it.ramp)) : 1;
  fx.zoom *= lerp(1, s, k);
};

// Световая засветка (light leak) — переход, делает compose.py
MAKE.leak = (it) => {
  EV.push({ t: it.t - 0.12, s: "riser", g: 0.26 });
  return (t, fx) => { const d = it.dur ?? 0.45; const k = (t - it.t) / d; if (k >= 0 && k <= 1) fx.leak = k; };
};

// Вспышка: белый/чёрный экран, текст печатается по буквам (разрядка сжимается, серый -> чёрный/белый)
MAKE.flash = (it) => it.lines ? flashLines(it) : flashText(it);
function flashLines(it) {
  const box = el("div", "flash");
  box.style.background = it.bg || "#121214";
  const ink = it.ink || (/^#?(fff|ffffff|f[0-9a-f]{5})$/i.test((it.bg || "").replace("#", "")) ? "#1a1a1a" : "#f2f2f2");
  const blk = el("div", "block", box);
  blk.style.alignItems = "center"; blk.style.color = ink;
  const NL = normLines(it.lines.map((L) => ({ ...L, size: L.size || "sp" })), it.t);
  const spans = buildLines(blk, NL);
  if (it.sfx !== false) for (const L of NL) EV.push({ t: L.words[0][1], s: L.type ? "typeone" : "cardclick", g: 0.8, v: 1 });   // один звук на строку карточки
  return (t) => {
    if (t < it.t || t >= it.end) { box.style.display = "none"; return; }
    box.style.display = "";
    for (const sp of spans) reveal(sp, t, "cinema");
    const r = blk.getBoundingClientRect();
    blk.style.transform = `translate(${(540 - r.width / 2).toFixed(1)}px, ${((it.y ?? 960) - r.height / 2).toFixed(1)}px)`;
  };
}
function flashText(it) {
  const box = el("div", "flash");
  box.style.background = it.bg || "#fff";
  const ink = it.ink || (/^#?(fff|ffffff|white)$/i.test((it.bg || "#fff").replace("#", "")) ? "#111" : "#f2f2f2");
  const tx = el("div", "txt", box);
  const chars = [...it.text].map((c) => { const s = el("span", "ch", tx, esc(c)); s.style.color = ink; return s; });
  const step = it.step ?? 0.045, t0 = it.t + (it.delay ?? 0.06);
  typeEvents(it.text, t0, step, 0.24);
  if (it.air) EV.push({ t: it.t, s: "air", g: 0.22 });
  return (t) => {
    if (t < it.t || t >= it.end) { box.style.display = "none"; return; }
    box.style.display = "";
    const n = chars.length, done = (t - t0) / (step * n);
    tx.style.letterSpacing = (lerp(0.32, 0, eOut(done)) ).toFixed(3) + "em";
    chars.forEach((s, i) => {
      const k = clamp((t - t0 - i * step) / 0.09);
      s.style.opacity = k; s.style.filter = k < 1 ? `blur(${((1 - k) * 4).toFixed(1)}px)` : "";
    });
    const ac = it.accent ? clamp((t - (it.accentAt ?? t0 + step * n + 0.15)) / 0.18) : 0;
    tx.style.color = ""; chars.forEach((s) => s.style.color = ac > 0 ? mix(ink, it.accent, ac) : ink);
    tx.style.opacity = lerp(0.55, 1, clamp(done));
  };
}

function mix(a, b, k) {
  const h = (c) => { c = c.replace("#", ""); if (c.length === 3) c = [...c].map((x) => x + x).join(""); return [0, 2, 4].map((i) => parseInt(c.substr(i, 2), 16)); };
  const A = h(a), B = h(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(",")})`;
}

// Заголовок на размытом фоне: «маркетплейс / 1688», печать по буквам, уезжает вверх с 3D-взмахом, ниже — пояснение
MAKE.title = (it) => {
  const box = el("div", "persp");
  const blk = el("div", "block shadowed", box);
  blk.style.alignItems = "center";
  let labSpans = [];
  // label — мелкая подпись над заголовком, under — под ним (каждая со своим временем появления)
  if (it.label) labSpans = labSpans.concat(buildLines(blk, normLines([{ size: "label", text: it.label, t: it.labelT ?? it.t + 0.5 }], it.t)));
  const tl = el("div", "line center sz-xl", blk);
  if (it.size) tl.style.fontSize = it.size + "px";
  const chars = [...it.text].map((c) => el("span", "ch", tl, esc(c)));
  if (it.under) labSpans = labSpans.concat(buildLines(blk, normLines([{ size: "label", text: it.under, t: it.underT ?? it.t + 0.5 }], it.t)));
  const sub = el("div", "block shadowed", box);
  const subSpans = it.sub ? buildLines(sub, normLines(it.sub, it.t)) : [];
  const step = it.step ?? 0.07, t0 = it.t;
  const R = rng(99);
  const POOL = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  const scr = it.from ? 0.42 : 0;   // перемешивание букв из прошлого заголовка (TAOBAO -> POIZON)
  if (it.sfx === "one") EV.push({ t: t0, s: "key1", g: 0.24 });            // один звук на заголовок (кино)
  else if (it.sfx !== false) {
    typeEvents(it.text, t0, it.from ? scr / Math.max(1, it.text.length) : step, 0.24);
    for (const { t: tw, w } of subSpans) typeEvents(w, tw, wordDur(w) / Math.max(1, w.length), 0.14);
    for (const { t: tw, w } of labSpans) typeEvents(w, tw, wordDur(w) / Math.max(1, w.length), 0.12);
    if (it.up != null) EV.push({ t: it.up, s: "swoosh", g: 0.16 });
  }
  return (t) => {
    if (t < it.t - 0.02 || t > it.end) { box.style.display = "none"; return; }
    box.style.display = "";
    chars.forEach((s, i) => {
      if (it.from) {
        const ki = clamp((t - t0) / scr * chars.length - i);
        const src = [...it.from][i] || " ";
        s.textContent = ki >= 1 ? it.text[i] : (t < t0 ? src : POOL[Math.floor(R() * POOL.length)]);
        s.style.opacity = 1; s.style.filter = ki < 1 && t >= t0 ? "blur(1.5px)" : "";
      } else {
        const k = clamp((t - t0 - i * step) / 0.16);
        s.style.opacity = k; s.style.filter = k < 1 ? `blur(${((1 - k) * 10).toFixed(1)}px)` : "";
        s.style.color = mix("#9a9aa2", "#ffffff", k);
      }
    });
    for (const { s, t: tw, w } of labSpans) wordReveal(s, (t - tw) / wordDur(w));
    for (const { s, t: tw, w } of subSpans) wordReveal(s, (t - tw) / wordDur(w));
    // положение блока: центр, затем вверх с 3D-взмахом
    const r = blk.getBoundingClientRect();
    const u = it.up != null ? clamp((t - it.up) / 0.5) : 0;
    const yc = lerp(it.y ?? 960, it.yUp ?? 470, eIO(u));
    const swing = Math.sin(Math.PI * clamp(u * 1.1));
    const ex = clamp((t - (it.end - 0.18)) / 0.18);
    const op = (it.from ? 1 : clamp((t - it.t + 0.02) / 0.12)) * (1 - eIn(ex));
    blk.style.opacity = op;
    blk.style.transformOrigin = "50% 50%";
    blk.style.transform = `translate(${(W / 2 - r.width / 2).toFixed(1)}px, ${(yc - r.height / 2 - 40 * eIn(ex)).toFixed(1)}px) rotateX(${(26 * swing).toFixed(2)}deg) rotateZ(${(-4 * swing).toFixed(2)}deg) scale(${(1 - 0.06 * swing).toFixed(3)})`;
    blk.style.filter = ex > 0 ? `blur(${(ex * 10).toFixed(1)}px)` : "";
    if (subSpans.length) {
      const rs = sub.getBoundingClientRect();
      sub.style.opacity = 1 - eIn(ex);
      sub.style.transform = `translate(${(W / 2 - rs.width / 2).toFixed(1)}px, ${((it.ySub ?? 1180) - rs.height / 2 - 40 * eIn(ex)).toFixed(1)}px)`;
      sub.style.filter = ex > 0 ? `blur(${(ex * 10).toFixed(1)}px)` : "";
    }
  };
};

// Карточка с фото: влёт с 3D-поворотом, подписи сверху/снизу, «перелистывание» свайпом со стеклянной линзой,
// уход через стеклянное растворение (рябь + расфокус)
MAKE.card = (it) => {
  const box = el("div", "persp");
  const card = el("div", "cardbox", box);
  if (it.img) el("img", "", card).src = it.img; else el("div", "emo", card, it.emoji || "📦");
  const pages = it.pages.map((p, i) => {
    const top = el("div", "clabel shadowed", box, esc(p.top || "")); top.style.top = "372px";
    const bot = el("div", "clabel shadowed", box); bot.style.top = "1346px";
    const spans = buildLines(bot, normLines([{ size: "m", text: p.bottom || "", t: p.bt ?? p.t + (i ? 0.08 : 0.42) }], p.t))   // bt — когда показать нижнюю подпись.map((x) => { x.s.parentNode.className = "line center"; return x; });
    return { ...p, top, bot, mt: motionBlur(top), mbb: motionBlur(bot), spans };
  });
  EV.push({ t: it.t, s: "tink", g: 0.16 });
  pages.slice(1).forEach((p) => { EV.push({ t: p.t - 0.02, s: "click2", g: 0.2 }); if (it.lens !== false) EV.push({ t: p.t - 0.85, s: "tink", g: 0.12 }); });
  if (it.exit !== "cut") EV.push({ t: it.end - 0.5, s: "shimmer", g: 0.14 });
  return (t, fx) => {
    if (t < it.t || t > it.end) { box.style.display = "none"; return; }
    box.style.display = "";
    // влёт
    const k = (t - it.t) / 0.62, s = spring(k);
    let sc = lerp(0.84, 1, s);
    // перелистывание: карточка «отступает», пока меняются подписи
    for (const p of pages.slice(1)) {
      const a = eIO((t - (p.t - 0.45)) / 0.35), b = eIO((t - (p.t + 0.45)) / 0.45);
      sc *= 1 - 0.17 * a * (1 - b);
    }
    const tx = lerp(70, 0, s), ty = lerp(-90, 0, s);
    card.style.opacity = clamp((t - it.t) / 0.12);
    card.style.transform = `translate(${tx.toFixed(1)}px, ${ty.toFixed(1)}px) rotateZ(${lerp(9, 0, s).toFixed(2)}deg) rotateY(${lerp(-24, 0, s).toFixed(2)}deg) rotateX(${lerp(10, 0, s).toFixed(2)}deg) scale(${sc.toFixed(4)})`;
    // подписи
    pages.forEach((p, i) => {
      const nxt = pages[i + 1];
      let x = 0, bx = 0, op = 1;
      if (i > 0) { const e = clamp((t - p.t) / 0.3); x = 420 * (1 - eOut(e)); bx = 30 * (1 - eOut(e)); op = e <= 0 ? 0 : clamp(e * 3); }
      else { op = clamp((t - it.t - 0.1) / 0.2); }
      if (nxt) { const e = clamp((t - nxt.t + 0.04) / 0.22); if (e > 0) { x = -460 * eIn(e); bx = 30 * eIn(e); op *= 1 - eIn(e); } }
      const vis = op > 0.001;
      for (const n of [p.top, p.bot]) { n.style.display = vis ? "" : "none"; n.style.opacity = op; n.style.transform = `translateX(${x.toFixed(1)}px)`; }
      p.mt(bx, 0); p.mbb(bx, 0);
      for (const { s, t: tw, w } of p.spans) wordReveal(s, (t - tw) / wordDur(w));
      if (i === 0) p.top.style.filter = p.top.style.filter || (op < 1 ? `blur(${((1 - op) * 8).toFixed(1)}px)` : "");
    });
    // стеклянная линза — «палец», который перелистывает
    if (it.lens !== false) for (const p of pages.slice(1)) {
      const a = t - (p.t - 0.9);
      if (a < 0 || a > 2.3) continue;
      const r = 72, y0 = 372 + 34;
      const x = 540 + 220 - 330 * eIO((a - 0.65) / 0.45) + 150 * eIO((a - 1.25) / 0.9);
      const op = clamp(a / 0.2) * (1 - clamp((a - 1.9) / 0.4));
      fx.lens = [x, y0 + 10 * Math.sin(a * 2.2), r * lerp(0.7, 1, eOut(a / 0.3)), op];
    }
    // уход: стеклянное растворение
    const g = clamp((t - (it.end - 0.5)) / 0.5);
    if (g > 0 && it.exit !== "cut") {
      // мягкая «волна» стекла: крупная низкочастотная рябь + сильный расфокус, без рваных краёв
      document.getElementById("gdisp").setAttribute("scale", (46 * Math.sin(Math.PI * Math.min(1, g * 1.2))).toFixed(1));
      document.getElementById("gblur").setAttribute("stdDeviation", (3 + 20 * eIO(g)).toFixed(1));
      document.getElementById("gturb").setAttribute("baseFrequency", `${(0.005 + 0.002 * g).toFixed(4)} ${(0.016 - 0.004 * g).toFixed(4)}`);
      box.style.filter = "url(#glassout)";
      box.style.opacity = 1 - eIn(g);
      card.style.transform += ` scale(${(1 + 0.05 * g).toFixed(3)})`;
    } else box.style.filter = "", box.style.opacity = 1;
  };
};

// Условная купюра (своя рисованная, не копия реальной валюты): бумага, гильоширная рамка, овал, номинал
function BILL(w) {
  const h = Math.round(w * 0.43);
  let g = "";
  for (let k = 0; k < 18; k++) g += `<path d="M${14 + k * 2} ${h * 0.5} Q ${w * 0.25} ${8 + k * 1.2} ${w * 0.5} ${h * 0.5} T ${w - 14 - k * 2} ${h * 0.5}" stroke="rgba(40,70,45,.10)" stroke-width="1" fill="none"/>`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <defs><linearGradient id="bp${w}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dfe6d6"/><stop offset=".5" stop-color="#c3cfb8"/><stop offset="1" stop-color="#aebda3"/></linearGradient>
    <radialGradient id="bo${w}"><stop offset="0" stop-color="#9fb090"/><stop offset="1" stop-color="#5f7a5a"/></radialGradient></defs>
    <rect width="${w}" height="${h}" rx="${w * 0.012}" fill="url(#bp${w})"/>
    <rect x="${w * 0.03}" y="${h * 0.07}" width="${w * 0.94}" height="${h * 0.86}" rx="${w * 0.01}" fill="none" stroke="#4d6b4f" stroke-width="${Math.max(1.5, w * 0.009)}"/>
    <rect x="${w * 0.045}" y="${h * 0.11}" width="${w * 0.91}" height="${h * 0.78}" fill="none" stroke="#6f8a68" stroke-width="${Math.max(1, w * 0.003)}" stroke-dasharray="${w * 0.006} ${w * 0.004}"/>
    ${g}
    <ellipse cx="${w * 0.5}" cy="${h * 0.5}" rx="${w * 0.13}" ry="${h * 0.34}" fill="url(#bo${w})" stroke="#3f5a42" stroke-width="${w * 0.005}"/>
    <text x="${w * 0.1}" y="${h * 0.34}" font-family="Inter" font-weight="800" font-size="${h * 0.2}" fill="#3e5a40">100</text>
    <text x="${w * 0.9}" y="${h * 0.84}" text-anchor="end" font-family="Inter" font-weight="800" font-size="${h * 0.26}" fill="#3e5a40">100</text>
    <circle cx="${w * 0.78}" cy="${h * 0.33}" r="${h * 0.12}" fill="none" stroke="#56724f" stroke-width="${w * 0.004}"/>
  </svg>`;
}

// Дождь из купюр (или любого эмодзи/картинки): 3D-вращение, смаз, крупные — ближе и размытее;
// cover: в конце огромная купюра закрывает кадр — склейка прячется за ней
MAKE.rain = (it) => {
  const box = el("div", "abs");
  const R = rng(it.seed ?? 11);
  const n = it.n ?? 14, dur = it.end - it.t;
  const ps = Array.from({ length: n }, (_, i) => {
    const near = R();
    const size = lerp(300, 880, near);
    const b = el("div", "bill", box, it.emoji ? it.emoji : BILL(size)); if (it.emoji) b.style.fontSize = size + "px";
    return { b, size, near, t0: it.t + R() * dur * 0.75, x: lerp(-150, W - 150, R()), v: lerp(1300, 2600, near), rx: lerp(-1, 1, R()), ry: lerp(-1, 1, R()), spin: lerp(220, 620, R()) * (R() < .5 ? -1 : 1), drift: lerp(-260, 260, R()), ph: R() * 360 };
  });
  let cover = null;
  if (it.cover) { cover = el("div", "bill", box, it.emoji ? it.emoji : BILL(1500)); if (it.emoji) cover.style.fontSize = "1500px"; EV.push({ t: it.end - 0.32, s: "swoosh", g: 0.22 }); }
  EV.push({ t: it.t + 0.05, s: "cash", g: it.cashGain ?? 0.3 });
  return (t) => {
    if (t < it.t || t > it.end + 0.05) { box.style.display = "none"; return; }
    box.style.display = "";
    for (const p of ps) {
      const a = t - p.t0;
      if (a < 0 || a > 2.2) { p.b.style.display = "none"; continue; }
      p.b.style.display = "";
      const y = -p.size + p.v * a, x = p.x + p.drift * a;
      const ang = p.ph + p.spin * a;
      p.b.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate3d(${p.rx.toFixed(2)}, ${p.ry.toFixed(2)}, 0.4, ${ang.toFixed(1)}deg)`;
      p.b.style.filter = `blur(${lerp(2, 14, p.near * p.near).toFixed(1)}px) brightness(${lerp(0.95, 0.75, p.near).toFixed(2)})`;
      p.b.style.opacity = p.near > 0.85 ? 0.92 : 1;
    }
    if (cover) {
      const c = clamp((t - (it.end - 0.32)) / 0.36);
      cover.style.display = c > 0 && c < 1 ? "" : "none";
      cover.style.transform = `translate(${lerp(-1300, 300, eIO(c)).toFixed(0)}px, ${lerp(-900, 500, eIO(c)).toFixed(0)}px) rotate(${lerp(-35, 10, c).toFixed(1)}deg)`;

// ===================== «Белый Apple-экран» (white board) =====================
// Сняты с референса пользователя: белый фон, оранжевая размытая волна, заголовок с буквами-пружинками,
// плашки-теги, плитки-виджеты с баунсом, iOS-выделение текста, печать списка, тёмная кнопка с папкой,
// стеклянный шар (делает compose.py по fx.ball), белый круг-шторка.
const WB_ORANGE = "#f06b4e";
const bounce = (k) => { k = clamp(k); return 1 - Math.exp(-7 * k) * Math.cos(6 * k); };            // мягкая пружина Apple: перелёт ~2.5 %
const springL = (k) => { k = clamp(k); return 1 - Math.exp(-6 * k) * Math.cos(6.5 * k); };         // буквы: перелёт ~5 %
const exitK = (t, it, d = 0.3) => clamp((t - (it.end - d)) / d);
function wbExit(node, t, it, baseTf = "") {
  const d = it.exitDur ?? 0.32, k = exitK(t, it, d);
  if (k <= 0) return false;
  const e = eIn(k);
  if (it.exit === "up") { node.style.transform = baseTf + ` translateY(${(-700 * e).toFixed(1)}px)`; node.style.filter = `blur(${(e * 14).toFixed(1)}px)`; }
  else if (it.exit === "down") { node.style.transform = baseTf + ` translateY(${(700 * e).toFixed(1)}px)`; node.style.filter = `blur(${(e * 14).toFixed(1)}px)`; }
  else if (it.exit === "drop") { node.style.transform = baseTf + ` translateY(${(1000 * e).toFixed(1)}px) rotate(${(5 * e).toFixed(2)}deg)`; node.style.filter = `blur(${(e * 10).toFixed(1)}px)`; }
  else if (it.exit === "circle") { node.style.clipPath = `circle(${(75 * (1 - e)).toFixed(1)}% at 50% 50%)`; node.style.transform = baseTf + ` scale(${(1 - 0.35 * e).toFixed(3)})`; }
  else if (it.exit !== "cut") { node.style.opacity = 1 - e; node.style.filter = `blur(${(e * 12).toFixed(1)}px)`; }
  return true;
}

MAKE.group = (it) => {
  const box = el("div", "abs"); box.style.width = "1080px"; box.style.height = "1920px";
  const [ox, oy] = it.origin || [540, 900]; box.style.transformOrigin = `${ox}px ${oy}px`;
  GROUPS[it.id] = box;
  const K = it.keys.map(([kt, v]) => [kt, { s: 1, x: 0, y: 0, r: 0, b: 0, o: 1, e: "spring", ...v }]);
  return (t) => {
    if (t < it.t || t > it.end) { box.style.display = "none"; return; }
    box.style.display = "";
    let v = { ...K[0][1] };
    for (let i = 1; i < K.length; i++) {
      const [t0] = K[i - 1], [t1, b] = K[i];
      if (t <= t0) break;
      const raw = clamp((t - t0) / Math.max(0.01, t1 - t0));
      const k = b.e === "in" ? eIn(raw) : b.e === "io" ? eIO(raw) : b.e === "out" ? eOut(raw) : bounce(raw);
      const a = { ...v }; for (const q of ["s", "x", "y", "r", "b", "o"]) v[q] = lerp(a[q], b[q], k);
    }
    box.style.transform = `translate(${v.x.toFixed(1)}px, ${v.y.toFixed(1)}px) rotate(${v.r.toFixed(2)}deg) scale(${v.s.toFixed(4)})`;
    box.style.filter = v.b > 0.2 ? `blur(${v.b.toFixed(1)}px)` : ""; box.style.opacity = v.o;
  };
};

// оранжевая размытая волна (снизу или сверху); поднимается за rise с, уходит за fall с
MAKE.wave = (it) => {
  const box = el("div", "abs"); box.style.width = "1080px"; box.style.height = "1920px"; box.style.overflow = "hidden";
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("width", "1080"); svg.setAttribute("height", "1920"); svg.style.filter = `blur(${it.blur ?? 42}px)`;
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("fill", it.color || WB_ORANGE); svg.appendChild(path); box.appendChild(svg);
  const top = it.from === "top", H0 = it.h ?? 560;
  const R = rng(it.seed ?? 5);
  // неровный «рваный» край, как в референсе: несколько крупных волн + мелкие частые бугры
  const ph = [...Array.from({ length: 3 }, () => [R() * 6.28, 0.35 + R() * 0.6, 0.004 + R() * 0.005, 60]),
              ...Array.from({ length: 4 }, () => [R() * 6.28, 0.6 + R() * 0.9, 0.012 + R() * 0.012, 24])];
  if (it.sfx !== false) EV.push({ t: it.t, s: "wbwhoosh", g: 0.9, v: 1 });
  return (t) => {
    if (t < it.t || t > it.end) { box.style.display = "none"; return; }
    box.style.display = "";
    const k = eOut((t - it.t) / (it.rise ?? 0.8)) * (1 - eIn((t - (it.end - (it.fall ?? 0.45))) / (it.fall ?? 0.45)));
    let d = "";
    for (let x = -60; x <= 1140; x += 15) {
      let h = H0 * k;
      for (const [p, sp, f, amp] of ph) h += Math.sin(x * f + p + t * sp) * amp * k;
      const y = top ? h : 1920 - h;
      d += (d ? " L" : "M") + `${x} ${y.toFixed(1)}`;
    }
    d += top ? " L1140 -80 L-60 -80 Z" : " L1140 2000 L-60 2000 Z";
    path.setAttribute("d", d);
  };
};

// заголовок / строки: "bounce" — буквы выпрыгивают по одной (стоят врозь и съезжаются), "slide" — слово въезжает слева из размытия,
// "type" — печать с проявлением (серый -> чёрный). Блок может переехать (move:[t, y]) и уйти (exit: up|down|blur|cut).
MAKE.btext = (it) => {
  const box = el("div", "abs wbf"); const lines = [];
  for (const L of it.lines) {
    const d = el("div", "wbline", box);
    d.style.fontSize = (L.size ?? 104) + "px"; d.style.fontWeight = L.weight ?? 800; d.style.letterSpacing = (L.ls ?? -0.035) + "em";
    if (L.color) d.style.color = L.color;
    const mode = L.mode || "bounce", step = L.step ?? (mode === "type" ? 0.05 : 0.045);
    let parts;
    if (mode === "slide" || mode === "word") parts = (L.words || L.text.split(" ").map((w, i) => [w, L.t + i * (L.wstep ?? 0.24)])).map(([w, wt], i, a) => ({ s: el("span", "wbw", d, esc(w) + (i < a.length - 1 ? " " : "")), t: wt }));
    else if (mode === "none") parts = [{ s: el("span", "wbw", d, esc(L.text)), t: L.t }];
    else parts = [...L.text].map((c, i) => ({ s: el("span", "wbch", d, esc(c)), t: L.t + i * step }));
    lines.push({ L, d, mode, parts, y: L.y ?? 0 });
    if (it.sfx !== false && L.sfx !== false) {
      if (mode === "slide") parts.forEach((p, i) => EV.push({ t: p.t, s: i ? "wbslide" : "wbwhoosh", g: i ? 0.7 : 0.6, v: 1 }));
      else if (mode === "word") parts.forEach((p) => EV.push({ t: p.t, s: "aplkey1", g: 0.6, v: 1 }));
      else if (mode === "none") EV.push({ t: L.t, s: "wbwhoosh", g: 0.5, v: 1 });
      else parts.forEach((p, i) => { if (p.s.textContent.trim()) EV.push({ t: p.t, s: "aplkey" + (1 + (i % 4)), g: mode === "type" ? 0.55 : 0.75, v: 1 }); });
    }
  }
  return (t) => {
    if (t < it.t - 0.02 || t > it.end) { box.style.display = "none"; return; }
    box.style.display = ""; box.style.opacity = 1; box.style.filter = ""; box.style.clipPath = "";
    let y0 = it.y ?? 820;
    for (const [mt, my, md] of it.move || []) y0 = lerp(y0, my, bounce((t - mt) / (md ?? 0.7)));
    let enterTf = "";
    if (it.enter === "tilt") { const k = bounce((t - it.t) / 0.6); enterTf = `translate(${((1 - k) * -60).toFixed(1)}px, ${((1 - k) * -260).toFixed(1)}px) rotate(${((1 - k) * -9).toFixed(2)}deg) scale(${lerp(0.9, 1, k).toFixed(3)})`;
      box.style.filter = k < 1 ? `blur(${((1 - clamp(k * 1.3)) * 14).toFixed(1)}px)` : ""; box.style.opacity = clamp((t - it.t) / 0.15); }
    box.style.transformOrigin = `540px ${y0}px`; box.style.transform = enterTf;
    for (const { L, d, mode, parts, y } of lines) {
      d.style.top = (y0 + y) + "px";
      for (const p of parts) {
        const k = (t - p.t) / (mode === "slide" ? 0.5 : mode === "word" ? 0.5 : 0.42);
        if (k <= 0) { p.s.style.opacity = 0; continue; }
        if (mode === "bounce" || mode === "word") {
          // как в референсе: буква/слово рождается маленьким (≈22 %) у линии шрифта на своём месте и дорастает пружиной;
          // ширина строки не меняется — строка не дёргается
          const b = springL(k * 0.95);
          p.s.style.opacity = clamp(k * 5);
          p.s.style.transformOrigin = "50% 85%";
          p.s.style.transform = `translateY(${((1 - b) * 0.18 * (L.size ?? 104)).toFixed(1)}px) scale(${lerp(0.22, 1, b).toFixed(3)})`;
          p.s.style.color = mix("#8e8e93", L.color || "#0b0b0d", clamp(k * 2.2));
          p.s.style.filter = "";
        } else if (mode === "none") {
          p.s.style.opacity = 1; p.s.style.transform = ""; p.s.style.filter = "";
        } else if (mode === "slide") {
          const e = eOut(clamp(k));
          p.s.style.opacity = clamp(k * 3);
          p.s.style.transform = `translateX(${((1 - e) * -90).toFixed(1)}px)`;
          p.s.style.filter = e < 1 ? `blur(${((1 - e) * 12).toFixed(1)}px)` : "";
          p.s.style.color = mix("#9a9aa0", L.color || "#0b0b0d", e);
        } else {
          const e = clamp(k * 2.2);
          p.s.style.opacity = e; p.s.style.filter = e < 1 ? `blur(${((1 - e) * 6).toFixed(1)}px)` : "";
          p.s.style.color = mix("#b4b4ba", L.color || "#0b0b0d", clamp(k * 1.3));
        }
      }
    }
    wbExit(box, t, it, enterTf);
  };
};

// плашка-тег: прилетает снизу-слева с поворотом, пружиной встаёт ровно

// плитка-виджет: картинка (из пака: engine/local/ui/…) или эмодзи/HTML в скруглённом квадрате; баунс-появление,
// "swap": [[t, img|emoji], …] — смена содержимого с прыжком; exit "circle" — сжимается в круг.
MAKE.tile = (it) => {

  const contents = [[it.t, it.img, it.emoji, it.html], ...(it.swap || []).map(([st, v]) => [st, /\.(png|jpe?g|webp)$/i.test(v) ? v : null, /\.(png|jpe?g|webp)$/i.test(v) ? null : v, null])];
  const ins = contents.map(([st, img, emo, html]) => {
    const d = el("div", "in", tl);
    if (img) { const im = el("img", "", d); im.src = img; if (it.fit === "full") { im.style.maxWidth = "100%"; im.style.maxHeight = "100%"; im.style.width = "100%"; } }

    return { d, st };
  });
  if (it.sfx !== false) { EV.push({ t: it.t, s: "wbbounce", g: 0.8, v: 1 }); for (const { st } of ins.slice(1)) EV.push({ t: st, s: "wbclick", g: 0.7, v: 1 }); }

    if (t < it.t || t > it.end) { tl.style.display = "none"; return; }

    for (const [mt, my, md] of it.move || []) y = lerp(y, my, bounce((t - mt) / (md ?? 0.7)));
    let s = lerp(0.6, 1, bounce((t - it.t) / 0.7));

    tl.style.left = "0px"; tl.style.top = "0px"; tl.style.transform = tf;
    tl.style.opacity = clamp((t - it.t) / 0.1);
    wbExit(tl, t, it, tf);
  };
};

// iOS-выделение текста: жирный текст печатается, синяя подсветка растёт вместе с ним, ручки по краям
MAKE.select = (it) => {
  const box = el("div", "abs wbf");

  const chars = [...it.text].map((c) => el("span", "wbch", tx, esc(c)));

  if (it.sfx !== false) { EV.push({ t: it.t, s: "wbselect", g: 0.8, v: 1 }); chars.forEach((c, i) => { if (c.textContent.trim()) EV.push({ t: it.t + 0.1 + i * step, s: "aplkey" + (1 + (i % 4)), g: 0.5, v: 1 }); }); }

// стеклянный шар: проезжает (x0 -> x1), преломляя то, что под ним; с frostAt мутнеет до лавандового и растёт до r1 (стирает экран)

    const k = eIO((t - it.t) / ((it.frostAt ?? it.end) - it.t));
    const x = lerp(it.x0 ?? 900, it.x1 ?? 520, k), y = it.y ?? 820;
    const f = it.frostAt ? clamp((t - it.frostAt) / (it.end - it.frostAt)) : 0;
    const r = lerp(it.r0 ?? 150, it.r1 ?? 900, eIn(f));
    const a = clamp((t - it.t) / 0.12);
    fx.ball = [x, y, r, a, clamp(f * 1.6)];
  };
};

// круг-шторка: цветной круг растёт из точки и закрывает экран
MAKE.circle = (it) => {
  const c = el("div", "abs"); c.style.borderRadius = "50%"; c.style.background = it.color || "#fbfbfb";
  if (it.sfx !== false) EV.push({ t: it.t, s: "wbwhoosh", g: 0.6, v: 1 });
  return (t) => {
    if (t < it.t || t > it.end) { c.style.display = "none"; return; }
    c.style.display = "";
    const r = lerp(it.r0 ?? 40, 2400, eIn(clamp((t - it.t) / (it.dur ?? 0.45))));
    const [x, y] = it.pos || [540, 2050];
    c.style.width = c.style.height = 2 * r + "px"; c.style.transform = `translate(${(x - r).toFixed(1)}px, ${(y - r).toFixed(1)}px)`;
  };
};
// значок/аватар-ник сверху (как «@ник» в пилюле)
MAKE.handle = (it) => {
  const d = el("div", "abs wbf"); d.style.cssText += "border:2px solid #cfcfd4;border-radius:999px;padding:6px 22px 6px 8px;font-size:26px;display:flex;align-items:center;gap:10px;background:#fff;color:#333;";
  if (it.img) { const im = el("img", "", d); im.src = it.img; im.style.cssText = "width:34px;height:34px;border-radius:50%;object-fit:cover"; }
  else { const c = el("span", "", d, esc((it.text || "n")[0].toUpperCase())); c.style.cssText = "width:34px;height:34px;border-radius:50%;background:#0b0b0d;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700"; }
  el("span", "", d, esc(it.text || "@nick"));
  return (t) => {
    if (t < it.t || t > it.end) { d.style.display = "none"; return; }
    d.style.display = ""; const b = bounce((t - it.t) / 0.5); const r = d.getBoundingClientRect();
    d.style.transform = `translate(${(540 - r.width / 2).toFixed(1)}px, ${(lerp(-80, it.y ?? 70, b)).toFixed(1)}px)`;
    d.style.opacity = 1 - exitK(t, it, 0.25);
  };
};

let GROUPS = {};
function build(data) {
  D = data; EV = []; FILT = 0; GROUPS = {};
  root = document.getElementById("root"); root.innerHTML = "";
  if (data.textShadow) {                   // светлое видео (небо, день): тень у текста плотнее — читается на любом фоне
    const st = document.createElement("style");
    st.textContent = `.shadowed { text-shadow: ${data.textShadow === true ? "0 2px 22px rgba(0,0,0,.55), 0 1px 4px rgba(0,0,0,.45)" : data.textShadow}; }`;
    document.head.appendChild(st);
  }
  const top = root;
  ITEMS = data.items.map((it) => {
    root = el("div", "abs", it.g && GROUPS[it.g] ? GROUPS[it.g] : top);   // свой контейнер у каждого элемента (слои); "g" — внутри группы-«камеры»
    if (it.sound) {                          // любой звук на появление элемента; роли «кино» — относительно голоса
      const rel = ["blockpop", "linepop", "typeone", "tagpop", "cardclick"].includes(it.sound);
      EV.push({ t: it.t + (it.soundAt || 0), s: it.sound, g: it.soundGain ?? (rel ? 1.4 : 0.26), v: rel ? 1 : 0 });
    }
    const f = MAKE[it.type](it);
    const c = root; root = top;
    return { it, f, c };
  });
}
// layer: undefined — всё; "front" — без элементов behind:true; "back" — только они (их compose.py кладёт ЗА человека)
function render(t, layer) {
  const fx = { blur: 0, dim: 0, zoom: 1, lens: null, ball: null, leak: -1, sil: 0, bg: null, face: face(t) };
  for (const { it, f, c } of ITEMS) {
    f && f(t, fx);
    const show = !layer || (layer === "back" ? !!it.behind : !it.behind);
    c.style.visibility = show ? "" : "hidden";
  }
  fx.hasBack = ITEMS.some(({ it }) => it.behind);
  return fx;
}
function events() { return EV.sort((a, b) => a.t - b.t); }
